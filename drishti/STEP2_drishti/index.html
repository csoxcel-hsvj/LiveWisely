. A compass works because north does not move. The Gita gives the scriptures that role: a standard outside your mood and convenience. It does not remove judgment; it anchors it. Svadharma (Dṛṣṭi 10) is your particular duty; Dharma is the larger standard that duty sits within.", "question": "Would I make this choice if no one were watching and nothing were gained?", "story": {"title": "Yudhishthira and the dog", "src": "Mahābhārata, Mahāprasthānika Parva, chapter 3", "text": ["At the end of their lives, the Pandavas and Draupadi set out on their last journey toward the Himalaya, followed by a dog. One by one the others fell on the way, until only Yudhishthira and the dog remained.", "Indra arrived in his chariot to take Yudhishthira to heaven, but said the dog could not come. Yudhishthira refused to abandon a creature that was devoted to him and had followed him all the way. Deserting one who depends on you, he said, was a grave wrong; he would rather give up heaven.", "The dog then revealed himself as Dharma, Yudhishthira's father, who had been testing him."]}, "mis": [["“Dharma means rigid rules without compassion.”", "Yudhishthira's dharma here was loyalty to a helpless creature."], ["“Dharma is whatever I feel is right.”", "The Gita points to a standard beyond personal convenience."]], "tryit": "Write down three rules you will not break this year, whatever the convenience. Keep them where you will see them.", "conn": [10, 8, 17]}, "15": {"sa": "Yukta", "deva": "युक्त", "en": "The Discipline of Moderation", "idea": "Balance in eating, sleeping, work and rest is itself a discipline.", "why": "We swing between extremes: crash diets and binges, all-nighters and oversleeping, hustle and burnout. Both ends break us.", "apply": [["Food", "Neither starving nor stuffing."], ["Sleep", "Regular hours, neither too little nor too much."], ["Work", "Steady effort instead of bursts and collapses."], ["Leisure", "Enough rest and play, not endless screens."]], "verses": [{"ref": "Bhagavad Gītā 6.16–17", "deva": ["नात्यश्नतस्तु योगोऽस्ति न चैकान्तमनश्नतः ।", "न चातिस्वप्नशीलस्य जाग्रतो नैव चार्जुन ॥", "युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु ।", "युक्तस्वप्नावबोधस्य योगो भवति दुःखहा ॥"], "iast": ["nātyaśnatas tu yogo 'sti na caikāntam anaśnataḥ", "na cātisvapna-śīlasya jāgrato naiva cārjuna", "yuktāhāra-vihārasya yukta-ceṣṭasya karmasu", "yukta-svapnāvabodhasya yogo bhavati duḥkhahā"], "gloss": [["atyaśnataḥ", "one who eats too much"], ["anaśnataḥ", "one who does not eat"], ["yukta", "measured, balanced"], ["vihāra", "recreation"], ["ceṣṭā", "effort"], ["duḥkhahā", "destroyer of sorrow"]], "tr": "Yoga is not for one who eats too much, nor for one who does not eat at all; not for one who sleeps too much, nor for one who stays awake too long, Arjuna. For one who is measured in eating and recreation, measured in effort at work, measured in sleep and waking, yoga becomes the destroyer of sorrow."}], "means": "Notice the word vihāra: recreation is included. The Gita is not asking for grim austerity; it asks for measure. Moderation is not mediocrity. It is the discipline that lets you keep going for the long run. Self-Mastery (Dṛṣṭi 14) is about withdrawing the senses and Santoṣa (Dṛṣṭi 7) about wanting less; Yukta is about finding the right amount.", "question": "Am I at an extreme right now, and what would the right measure look like?", "story": {"title": "King Yayati's confession", "src": "Mahābhārata, Ādi Parva, chapters 84–85; also Bhāgavata Purāṇa, Canto 9", "text": ["Cursed with early old age, King Yayati persuaded his youngest son, Puru, to exchange his youth for his father's age. Yayati then enjoyed every pleasure for a thousand years.", "At last he returned Puru's youth and declared what he had learned: desire is never quenched by enjoying its objects. Like fire fed with ghee, it only blazes higher.", "He crowned Puru king and went to the forest. A thousand years of excess had taught him what measure could have taught far sooner."]}, "mis": [["“Moderation means never giving your best.”", "Measured effort is not low effort."], ["“Moderation in everything, even wrongdoing.”", "Measure applies to what is good. Adharma has no right amount."]], "tryit": "Fix a sleep time and a waking time for this week and keep within 30 minutes of them, weekends included.", "conn": [14, 7, 28]}, "16": {"sa": "Īśvara-praṇidhāna", "deva": "ईश्वरप्रणिधान", "en": "Surrender Without Giving Up Effort", "idea": "Offer everything you do to the Lord: full effort, with full trust in Him.", "why": "There are two traps: believing everything depends on us (anxiety and arrogance) or believing nothing does (passivity and fatalism). Surrender, rightly understood, frees us from both.", "apply": [["Work", "Offering even routine tasks."], ["Crisis", "Doing everything you can, and trusting beyond that."], ["Daily life", "Meals, chores and duties as offerings."], ["Parenting", "Giving your best, and placing your child in the Lord's care."]], "verses": [{"ref": "Bhagavad Gītā 9.27", "deva": ["यत्करोषि यदश्नासि यज्जुहोषि ददासि यत् ।", "यत्तपस्यसि कौन्तेय तत्कुरुष्व मदर्पणम् ॥"], "iast": ["yat karoṣi yad aśnāsi yaj juhoṣi dadāsi yat", "yat tapasyasi kaunteya tat kuruṣva mad-arpaṇam"], "gloss": [["karoṣi", "you do"], ["aśnāsi", "you eat"], ["juhoṣi", "you offer in sacrifice"], ["dadāsi", "you give"], ["tapasyasi", "you practise austerity"], ["mad-arpaṇam", "as an offering to Me"]], "tr": "Whatever you do, whatever you eat, whatever you offer in sacrifice, whatever you give, whatever austerity you practise, son of Kunti, do it as an offering to Me."}], "means": "Look at the list: doing, eating, offering, giving, disciplining oneself. Krishna does not ask Arjuna to stop any of them; he asks that each be offered. Surrender changes the purpose of an action, not the effort in it. Niṣkāma Karma (Dṛṣṭi 9) is about letting go of the fruit; Īśvara-praṇidhāna turns the whole of life, and oneself, toward the Lord. The term itself is Patañjali's (related: Yoga Sūtra 1.23 and 2.32); this book anchors it in the Gita.", "question": "Have I done my part fully, and have I offered it?", "story": {"title": "Gajendra", "src": "Bhāgavata Purāṇa, Canto 8, chapters 2–4", "text": ["Gajendra, king of the elephants, was bathing in a lake when a crocodile seized his leg. He fought with all his strength, and the Bhāgavata says the struggle went on for a thousand years while his herd watched, unable to help.", "When his strength was spent and he saw that no one else could save him, he turned with his whole heart to the Lord in prayer. Vishnu came on Garuda, killed the crocodile and freed him.", "Gajendra's surrender did not replace his effort. It came after he had given everything he had."]}, "mis": [["“Surrender means doing nothing and waiting.”", "Gajendra fought first."], ["“Surrender is weakness.”", "It takes strength to admit what lies beyond you."]], "tryit": "Before starting work each day this week, pause for ten seconds and offer it. At the end of the day, offer the results too, whatever they are.", "conn": [9, 1, 30]}, "19": {"sa": "Maitrī & Karuṇā", "deva": "मैत्री करुणा", "en": "Strength That Does Not Need Cruelty", "idea": "Be friendly toward all, and compassionate even toward those who oppose you.", "why": "Strength is often confused with harshness: humiliating rivals, cruelty online, the belief that kindness is for losers. Real strength can afford kindness.", "apply": [["Leadership", "Firm decisions made without contempt."], ["Competition", "Respect for rivals, in winning and in losing."], ["Online", "Disagreeing without dehumanising."], ["After a fallout", "Wishing the other person well."]], "verses": [{"ref": "Bhagavad Gītā 12.13", "deva": ["अद्वेष्टा सर्वभूतानां मैत्रः करुण एव च ।", "निर्ममो निरहङ्कारः समदुःखसुखः क्षमी ॥"], "iast": ["adveṣṭā sarva-bhūtānāṃ maitraḥ karuṇa eva ca", "nirmamo nirahaṅkāraḥ sama-duḥkha-sukhaḥ kṣamī"], "gloss": [["adveṣṭā", "without hatred"], ["sarva-bhūtānām", "toward all beings"], ["maitraḥ", "friendly"], ["karuṇaḥ", "compassionate"], ["nirmamaḥ", "free from possessiveness"], ["kṣamī", "forgiving"]], "tr": "One who bears no hatred toward any being, who is friendly and compassionate, free from possessiveness and ego, even in sorrow and joy, and forgiving: (such a devotee is dear to Me)."}], "means": "This verse opens Krishna's description of the devotee who is dear to Him (12.13–20). It begins not with rituals but with an attitude toward all beings: no hatred, friendliness, compassion. And it was spoken to a warrior on a battlefield: you can oppose someone without hating them. Ahiṃsā (Dṛṣṭi 18) is not harming; Dayā & Dāna (Dṛṣṭi 20) is giving; Maitrī & Karuṇā is the warmth behind both, extended even to opponents.", "question": "Can I oppose this person's actions without hating the person?", "story": {"title": "Rama and Ravana's last rites", "src": "Rāmāyaṇa, Yuddha Kāṇḍa", "text": ["After Ravana fell, his brother Vibhishana, who had joined Rama, hesitated to perform Ravana's funeral rites because of all the wrong Ravana had done.", "Rama told him that enmity ends with death. Their purpose was achieved. Ravana was now as much Rama's own as Vibhishana's, and should receive his rites with honour.", "Rama had fought Ravana with all his strength. Once the fight was over, he needed no cruelty."]}, "mis": [["“Kindness means letting people walk over you.”", "Rama fought, and won."], ["“Compassion is for people I like.”", "The verse says all beings."]], "tryit": "Think of one person you oppose. Write one sincere good wish for them.", "conn": [18, 22, 20]}, "23": {"sa": "Satsaṅga", "deva": "सत्सङ्ग", "en": "Your Company Becomes Part of You", "idea": "Spend time with those who lift your mind. Their company becomes part of you.", "why": "We become like the people we spend most time with, and today also like the voices in our feeds. Poor company works slowly and quietly. So does good company.", "apply": [["Friends", "Who you spend your free evenings with."], ["Online", "Who you follow and what you read."], ["Work", "Finding mentors and peers who raise your standards."], ["Family", "Gatherings that nourish rather than drain."]], "verses": [{"ref": "Bhagavad Gītā 10.9", "deva": ["मच्चित्ता मद्गतप्राणा बोधयन्तः परस्परम् ।", "कथयन्तश्च मां नित्यं तुष्यन्ति च रमन्ति च ॥"], "iast": ["mac-cittā mad-gata-prāṇā bodhayantaḥ parasparam", "kathayantaś ca māṃ nityaṃ tuṣyanti ca ramanti ca"], "gloss": [["mac-cittāḥ", "with minds fixed on Me"], ["mad-gata-prāṇāḥ", "lives given to Me"], ["bodhayantaḥ parasparam", "enlightening one another"], ["kathayantaḥ", "speaking of"], ["tuṣyanti", "are content"], ["ramanti", "delight"]], "tr": "With their minds on Me and their lives given to Me, enlightening one another and always speaking of Me, they are content and they delight."}], "means": "This is the Gita's picture of good company: people who enlighten one another (bodhayantaḥ parasparam) and find joy in it. Satsaṅga means the company of the good and the true. It works both ways: you receive, and you give. The question is not whether company shapes you, since it always does, but what it is shaping you into.", "question": "After time with these people, am I clearer and better, or more agitated and smaller?", "story": {"title": "Narada's earlier life", "src": "Bhāgavata Purāṇa, Canto 1, chapters 5–6", "text": ["Narada tells Vyasa how, in an earlier life, he was the young son of a maidservant. One rainy season, sages stayed where his mother worked, and the boy was set to serve them.", "He listened to their talk about the Lord and, with their permission, ate what remained of their food. His heart was transformed.", "That brief time in good company shaped the rest of his existence. He became the sage Narada."]}, "mis": [["“Satsaṅga means only religious gatherings.”", "It is any company that lifts you toward the good."], ["“Avoid everyone who isn't perfect.”", "It is about what you are drawn into, not about judging others."]], "tryit": "List the five people and five online sources you spend most time with. This week, add one source of good company and reduce one that drags you down.", "conn": [28, 29, 12]}, "29": {"sa": "Svādhyāya", "deva": "स्वाध्याय", "en": "Study the World and Yourself", "idea": "Never stop studying: the scriptures, the world and yourself.", "why": "Schooling ends, and learning often ends with it. Meanwhile we “know” a great deal from headlines and feeds without studying anything deeply, least of all ourselves.", "apply": [["Reading", "A little serious reading every day."], ["Work", "Deepening your craft long after training ends."], ["Reflection", "Examining your own conduct, honestly."], ["Scripture", "Regular study, with questions."]], "verses": [{"ref": "Taittirīya Upaniṣad 1.11.1 (excerpts)", "deva": ["सत्यं वद । धर्मं चर । स्वाध्यायान्मा प्रमदः ।", "स्वाध्यायप्रवचनाभ्यां न प्रमदितव्यम् ॥"], "iast": ["satyaṃ vada, dharmaṃ cara, svādhyāyān mā pramadaḥ", "svādhyāya-pravacanābhyāṃ na pramaditavyam"], "gloss": [["vada", "speak"], ["cara", "practise"], ["svādhyāyāt", "from your study"], ["mā pramadaḥ", "do not neglect"], ["pravacana", "teaching, sharing what you learn"]], "tr": "Speak the truth. Practise dharma. Do not neglect your study. … Do not neglect study and teaching."}, {"ref": "Bhagavad Gītā 4.34", "deva": ["तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया ।", "उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः ॥"], "iast": ["tad viddhi praṇipātena paripraśnena sevayā", "upadekṣyanti te jñānaṃ jñāninas tattva-darśinaḥ"], "gloss": [["praṇipātena", "by humble approach"], ["paripraśnena", "by sincere questioning"], ["sevayā", "by service"], ["tattva-darśinaḥ", "those who have seen the truth"]], "tr": "Learn it by approaching the wise with humility, by sincere questions and by service. The wise who have seen the truth will teach you that knowledge."}], "means": "The first passage is the teacher's parting advice to students as they graduate, the same passage that gives us Atithi Devo Bhava (Dṛṣṭi 21). Study does not end with graduation. Svādhyāya traditionally means study of the scriptures; it naturally includes studying yourself in their light. The Gita adds the method: humility, questions and service. Viveka (Dṛṣṭi 8) is judgment and Satsaṅga (Dṛṣṭi 23) is company; Svādhyāya is the daily discipline of learning.", "question": "What have I studied deeply this month, and what have I learned about myself?", "story": {"title": "Shvetaketu comes home proud", "src": "Chāndogya Upaniṣad 6.1", "text": ["Shvetaketu left home at twelve to study and returned at twenty-four, having learned all the Vedas, and full of pride.", "His father, Uddalaka Aruni, asked him: did you ask for that teaching by which the unheard becomes heard, the unthought becomes thought, the unknown becomes known? Shvetaketu had not. His teachers, he said, must not have known it, and he asked his father to teach him.", "Twelve years had given him information. Humility and a sincere question began his real learning."]}, "mis": [["“Study is for students.”", "The Upanishad's advice is for life after graduation."], ["“Self-study means self-absorption.”", "It means examining yourself in the light of the scriptures."]], "tryit": "Read one page of a scripture each day this week, and write one line on how it applies to your day.", "conn": [8, 23, 17]}, "30": {"sa": "Śraddhā", "deva": "श्रद्धा", "en": "You Become What You Trust", "idea": "Your deepest trust shapes who you become. Choose carefully what you place it in.", "why": "Everyone has śraddhā in something: money, approval, a leader, an expert, oneself, the Lord. We rarely notice what we trust, yet it decides how we act when things get hard.", "apply": [["Career", "Whose advice you build your choices on."], ["Health", "Which sources of guidance you rely on."], ["Influence", "Who you follow, and why."], ["Inner life", "What you lean on in a crisis."]], "verses": [{"ref": "Bhagavad Gītā 17.3", "deva": ["सत्त्वानुरूपा सर्वस्य श्रद्धा भवति भारत ।", "श्रद्धामयोऽयं पुरुषो यो यच्छ्रद्धः स एव सः ॥"], "iast": ["sattvānurūpā sarvasya śraddhā bhavati bhārata", "śraddhāmayo 'yaṃ puruṣo yo yac-chraddhaḥ sa eva saḥ"], "gloss": [["sattva-anurūpā", "in keeping with one's nature"], ["śraddhā", "faith, deep trust"], ["śraddhāmayaḥ", "made of faith"], ["yat-śraddhaḥ", "whatever one's faith is in"], ["sa eva saḥ", "that indeed one is"]], "tr": "Everyone's faith, Bhārata, follows their nature. A person is made of faith: whatever one's faith is, that indeed is what one is."}], "means": "The Gita says we are “made of faith”. Believing in nothing is not an option; the real question is what we believe in and how that trust was formed. Chapter 17 links faith to the guṇas: what you trust grows from your nature, and also reshapes it. Śraddhā is not blind belief. The Gita pairs it with effort and knowledge: the one with faith gains knowledge (4.39). Īśvara-praṇidhāna (Dṛṣṭi 16) is offering action and Svādhyāya (Dṛṣṭi 29) is study; Śraddhā is the trust that makes both possible.", "question": "What am I really putting my trust in, and is it worthy of that trust?", "story": {"title": "Aruni in the breach", "src": "Mahābhārata, Ādi Parva (Pauṣya Parva, chapter 3)", "text": ["The sage Ayoda Dhaumya had a student named Aruni of Panchala. One day he sent Aruni to stop a breach in the embankment of a field, where water was pouring out.", "Unable to stop it any other way, Aruni lay down in the breach and held back the water with his own body. When he did not return, his teacher went looking and called out for him. Aruni rose from the breach and came.", "Pleased, Dhaumya named him Uddalaka, the one who rose from the breach, and blessed him that all the scriptures would shine in his mind. Trust in his teacher's word, and wholehearted effort, became the way knowledge came to him."]}, "mis": [["“Faith means switching off reason.”", "In the Gita, faith leads to knowledge (4.39)."], ["“Faith is only about religion.”", "Everyone trusts something; the question is what."]], "tryit": "Write down the three things you trust most for guidance. For each, ask where that trust came from and whether it has been earned.", "conn": [29, 16, 28]}}, "parts": [{"num": "I", "name": "Inner Peace", "desc": "How you see what happens inside you.", "ids": [1, 2, 3, 4, 5, 6, 7, 8]}, {"num": "II", "name": "Right Action", "desc": "How you act, and why.", "ids": [9, 10, 11, 12, 13, 14, 15, 16]}, {"num": "III", "name": "Living with Others", "desc": "How you meet the people around you.", "ids": [17, 18, 19, 20, 21, 22, 23]}, {"num": "IV", "name": "Living with the World", "desc": "How you take part in the larger whole.", "ids": [24, 25, 26, 27, 28, 29, 30]}], "situations": [["I can't focus", "Everything pulls at me at once.", [3, 5, 14]], ["I'm anxious about how something will turn out", "An exam, a result, a decision someone else will make.", [9, 1]], ["My mind won't stop racing", "Thoughts keep arriving, and I keep obeying them.", [4, 2]], ["Someone hurt me and I can't let go", "I keep replaying it.", [22, 19]], ["I keep comparing myself to others", "Their life always looks better than mine.", [7, 10]], ["I don't know which path to take", "Career, relationships, what's mine to do.", [10, 11]], ["I'm stuck in a habit I want to break", "I know better, and do it anyway.", [13, 12, 14]], ["I'm going through something hard", "It hurts, and it isn't over yet.", [6, 16]], ["I want more, and it's never enough", "Every gain resets the hunger.", [7, 26]], ["I'm burning out", "All effort, no balance.", [15, 27]], ["I can't stand someone I disagree with", "Opposition is turning into contempt.", [19, 18]], ["I'm tempted to cut a corner", "No one would know.", [17, 11]], ["The people around me drag me down", "Their habits are becoming mine.", [23, 28]], ["I'm not sure what to trust", "Too many voices, too much advice.", [30, 29]]], "challenges": [{"d": 8, "setup": "The Yaksha has answered all his questions and makes an offer: one of Yudhishthira's four fallen brothers may live again. Just one. A war lies ahead.", "ask": "Whom does Yudhishthira bring back?", "options": ["Bhima, the strongest", "Arjuna, the greatest archer", "Nakula, his half-brother", "No one; he refuses to choose"], "answer": 2, "reveal": "He chose Nakula. Kunti's son was alive, so Madri's line deserved a living son too. Moved by this fairness, the Yaksha, who was Dharma himself, restored all four."}, {"d": 3, "setup": "Before the war, Krishna offers Arjuna and Duryodhana a choice. On one side, his vast Narayani army. On the other, Krishna himself: alone, unarmed, not fighting.", "ask": "Arjuna gets first pick. What does he choose?", "options": ["The whole army", "Krishna alone, unarmed", "Half of each"], "answer": 1, "reveal": "He chose Krishna, who became his charioteer and spoke the Gita from the driver's seat. Who guides the chariot matters more than how many horses run beside it."}, {"d": 11, "setup": "At the gates of heaven, Indra welcomes Yudhishthira, but says the dog that followed him all the way cannot enter.", "ask": "What does Yudhishthira do?", "options": ["Enters heaven, sadly leaving the dog", "Refuses heaven rather than abandon the dog", "Asks Indra to find the dog another home"], "answer": 1, "reveal": "He refused heaven. Abandoning one who depends on you, he said, is a grave wrong. The dog revealed himself as Dharma, who had been testing him."}, {"d": 12, "setup": "Yama, the lord of death, tries to buy off the boy Nachiketa: long life, sons and grandsons, gold, a kingdom, every pleasure. In return, Nachiketa must drop his question about what happens after death.", "ask": "What does Nachiketa do?", "options": ["Takes the kingdom", "Takes long life", "Refuses everything and keeps his question"], "answer": 2, "reveal": "He refused it all: these things wear out, he said; keep them. Delighted, Yama praised him for choosing the good over the pleasant, and taught him."}, {"d": 7, "setup": "Sudama, poor and content, walks to Dwaraka to see his childhood friend Krishna, carrying only a handful of flattened rice. Krishna welcomes him like a king.", "ask": "What does Sudama ask Krishna for?", "options": ["Money for his family", "A place at the royal court", "Nothing at all"], "answer": 2, "reveal": "Nothing. He went home happy just to have seen his friend, and found his hut transformed. Even then he lived without attachment. His contentment came before his fortune."}, {"d": 9, "setup": "Hanuman is mid-leap across the ocean to find Sita. The mountain Mainaka rises from the sea and offers him a place to rest.", "ask": "What does Hanuman do?", "options": ["Rests a while to regain strength", "Touches the mountain in respect and flies on", "Flies past without a glance"], "answer": 1, "reveal": "He touched it in respect and flew on. He would not pause until the task was done, and later wanted no reward beyond Rama's embrace."}, {"d": 22, "setup": "Ashwatthama has killed Draupadi's five sleeping sons. Arjuna drags him before her, bound.", "ask": "What does Draupadi ask for?", "options": ["His death", "His release", "That he be imprisoned for life"], "answer": 1, "reveal": "In the Bhāgavata, she asks that he be released: he is their teacher's son, and she does not want his mother to weep as she is weeping. Krishna spares his life but has his jewel taken and sends him away."}, {"d": 19, "setup": "Ravana has fallen. His brother Vibhishana, who joined Rama, hesitates to perform Ravana's funeral rites after all the wrong Ravana did.", "ask": "What does Rama tell him?", "options": ["Leave the body; he deserves nothing", "Let others perform the rites", "Perform them with honour; enmity ends with death"], "answer": 2, "reveal": "Enmity ends with death, Rama said. Ravana is now as much his own as Vibhishana's. Rama fought with all his strength, and needed no cruelty once the fight was over."}, {"d": 20, "setup": "A dove flees into King Shibi's lap. The hawk chasing it demands its prey: it is hungry, and the dove is its natural food.", "ask": "What does Shibi do?", "options": ["Hands over the dove", "Chases the hawk away", "Offers flesh from his own body instead"], "answer": 2, "reveal": "He offered his own flesh, and finally himself, on the scale. The hawk and dove were Indra and Agni, testing him. He protected the weak without denying the hungry."}, {"d": 16, "setup": "A crocodile has seized Gajendra, king of the elephants, by the leg in a lake. His herd cannot help.", "ask": "What does Gajendra do?", "options": ["Prays at once and waits", "Fights with all his strength, then surrenders to the Lord", "Calls his herd until they come"], "answer": 1, "reveal": "He fought with everything he had; the Bhāgavata says for a thousand years. Only when his strength was spent did he turn wholly to the Lord, who came and freed him. Surrender came after effort, not instead of it."}, {"d": 17, "setup": "Young Satyakama wants to study with a great teacher, who asks about his lineage. His mother has told him she does not know who his father was.", "ask": "What does Satyakama say?", "options": ["Invents a respectable lineage", "Repeats his mother's words exactly", "Changes the subject"], "answer": 1, "reveal": "He told the exact truth. The teacher said only a true brahmin would speak so honestly, and accepted him."}, {"d": 6, "setup": "Twelve years into their forest exile, with one year of hiding still to come, Bhima urges Yudhishthira to end the hardship and fight for the kingdom now.", "ask": "What does Yudhishthira decide?", "options": ["Ends the exile early", "Keeps their word and completes all thirteen years"], "answer": 1, "reveal": "He kept their word and bore the hardship to the end of the term. Only then did the Pandavas claim their kingdom."}], "guess": [{"line": "Focus on your effort, not on the outcome.", "ancient": true, "src": "Bhagavad Gītā 2.47", "d": 9, "note": "Your right is to the action alone, never to its fruits."}, {"line": "Your mind can be your best friend or your worst enemy.", "ancient": true, "src": "Bhagavad Gītā 6.5–6", "d": 2, "note": "The mind alone is the friend of the self, and the mind alone is its enemy."}, {"line": "Fake it till you make it.", "ancient": false, "src": "A modern saying", "d": 17, "note": "The Upaniṣad would disagree: truth alone wins, not untruth."}, {"line": "You become what you repeatedly do.", "ancient": true, "src": "Bṛhadāraṇyaka Upaniṣad 4.4.5", "d": 13, "note": "As one acts and as one conducts oneself, so one becomes."}, {"line": "Neither starve nor binge. Neither oversleep nor stay up all night.", "ancient": true, "src": "Bhagavad Gītā 6.16–17", "d": 15, "note": "Yoga is for one who is measured in eating, recreation, effort and sleep."}, {"line": "Treat yourself. You deserve it.", "ancient": false, "src": "A modern advertising line", "d": 12, "note": "The Kaṭha Upaniṣad asks a harder question: is it good, or only pleasant?"}, {"line": "Discomfort comes and goes. Bear it.", "ancient": true, "src": "Bhagavad Gītā 2.14", "d": 6, "note": "Cold and heat, pleasure and pain come and go; they do not last."}, {"line": "You are what you believe.", "ancient": true, "src": "Bhagavad Gītā 17.3", "d": 30, "note": "A person is made of faith: whatever one's faith is, that one is."}, {"line": "Who's driving your life: your judgment, or your impulses?", "ancient": true, "src": "Kaṭha Upaniṣad 1.3.3–4", "d": 3, "note": "The intellect is the charioteer, the mind the reins, the senses the horses."}], "credits": [["Concept, curation & creative direction", "Jagan"], ["AI-assisted development, research synthesis & editorial support", "Claude Opus 5.5 (Anthropic)"], ["Verification, source-checking & editorial review", "Sarvam AI assistant"]], "edition": "Edition 0.9 · 2 October 2026", "intro": {"ref": "Bhagavad Gītā 13.27 (13.28 in some editions)", "deva": ["समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम् ।", "विनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति ॥"], "iast": ["samaṃ sarveṣu bhūteṣu tiṣṭhantaṃ parameśvaram", "vinaśyatsv avinaśyantaṃ yaḥ paśyati sa paśyati"], "gloss": [["samam", "equally"], ["tiṣṭhantam", "dwelling"], ["parameśvaram", "the Supreme Lord"], ["avinaśyantam", "the imperishable"], ["paśyati", "sees"]], "tr": "One who sees the Supreme Lord dwelling equally in all beings, the imperishable within the perishable: that one truly sees."}}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const D = DATA.d, PARTS = DATA.parts;
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- device memory (optional; works without it) ---- */
const KEY='drishti-web-v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
let S = load(); S.seen=S.seen||[]; S.trying=S.trying||[]; S.notes=S.notes||{}; S.first=S.first||Date.now();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
save();
function weekDrishti(){ const w=Math.floor((Date.now()-S.first)/(7*864e5)); return (w%30)+1; }

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }
function partOf(n){ return PARTS.find(p=>p.ids.includes(n)); }
function go(h){ location.hash=h; }
function top(back){ return `<div class="top"><div class="wrap"><button data-go="${back||'#/'}">Back</button><button data-go="#/all">All 30</button></div></div>`; }

/* ---------- views ---------- */
function home(){
  const w=weekDrishti(), d=D[w];
  return `<div class="home"><div class="wrap">
  <svg class="eye" width="110" height="60" viewBox="0 0 110 60" aria-hidden="true">
   <g class="lid"><path d="M5 30 Q55 -6 105 30 Q55 66 5 30 Z" fill="none" stroke="#E2B27A" stroke-width="1.6"/>
   <circle cx="55" cy="30" r="14" fill="none" stroke="#E2B27A" stroke-width="1.3"/></g>
   <circle class="pupil" cx="55" cy="30" r="6" fill="#E2B27A"/></svg>
  <h1>Dṛṣṭi</h1><div class="dvn deva" lang="sa">दृष्टि</div>
  <p class="tag">Thirty ways of seeing from India's ancient wisdom. Change the way you see, and your life changes with it.</p>
  <p style="margin:14px 0 0"><button class="link-btn" data-go="#/about">About this book</button></p>
  <h2>What would you like to do today?</h2>
  <button class="door" data-go="#/face"><b>Start from what you're facing</b><span>Pick what's on your mind and find the lens for it.</span></button>
  <button class="door" data-go="#/story/0"><b>Step into a story</b><span>Each story stops at the moment of choice. What would you do?</span></button>
  <button class="door" data-go="#/guess/0"><b>Ancient or modern?</b><span>Guess where a line comes from. Some will surprise you.</span></button>
  <div class="week"><small>Your Dṛṣṭi this week</small>
   <div class="nm">${w}. ${esc(d.sa)} <span class="deva" lang="sa" style="color:var(--gold);font-size:18px">${esc(d.deva)}</span></div>
   <p>${esc(d.idea)}</p><button class="link-btn" data-go="#/d/${w}">Open Dṛṣṭi ${w}</button></div>
  <div class="allrow"><button class="link-btn" data-go="#/all">Browse all 30 Dṛṣṭis</button><span class="count">${S.seen.length} of 30 explored</span></div>
  <div class="credits">${DATA.credits.map(c=>`<div>${esc(c[0])}<br><em>${esc(c[1])}</em></div>`).join('')}<div><em>${esc(DATA.edition)}</em></div></div>
  </div></div>`;
}

function all(){
  let h = top('#/') + `<div class="wrap page"><p class="kicker">Thirty lenses in four parts</p><h1>All Dṛṣṭis</h1>`;
  for(const p of PARTS){
    h += `<div class="part"><h2>Part ${p.num}: ${esc(p.name)}</h2><p>${esc(p.desc)}</p><div class="grid">`;
    for(const n of p.ids){ const d=D[n];
      h += `<a href="#/d/${n}"><span class="n">${n}</span><span>${esc(d.sa)}<span class="e">${esc(d.en)}</span></span><span class="dot ${S.seen.includes(n)?'on':''}" aria-label="${S.seen.includes(n)?'explored':'not yet explored'}"></span></a>`;
    }
    h += `</div></div>`;
  }
  return h + `</div>`;
}

function face(){
  let h = top('#/') + `<div class="wrap page"><p class="kicker">Start from what you're facing</p><h1>What's on your mind?</h1><p style="color:var(--muted);margin-top:10px">Choose the one that feels closest.</p>`;
  DATA.situations.forEach((s,i)=>{
    h += `<button class="sit" aria-expanded="false" data-sit="${i}"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></button><div class="sitres" id="sit${i}" hidden>`;
    for(const n of s[2]){ const d=D[n];
      h += `<a class="rowlink" href="#/d/${n}"><b>Dṛṣṭi ${n}: ${esc(d.sa)}</b><span>${esc(d.idea)}</span></a>`; }
    h += `</div>`;
  });
  return h + `</div>`;
}

function story(i){
  const C = DATA.challenges, c = C[i], d = D[c.d];
  let h = top('#/') + `<div class="wrap page"><p class="kicker">Step into a story</p><p class="step">Story ${i+1} of ${C.length} · ${esc(d.story.src)}</p>
  <h1 style="font-size:30px">${esc(d.story.title)}</h1><p style="margin-top:16px">${esc(c.setup)}</p><p class="ask">${esc(c.ask)}</p><div id="opts">`;
  c.options.forEach((o,k)=> h += `<button class="choice" data-opt="${k}">${esc(o)}</button>`);
  h += `</div><div id="rev"></div></div>`;
  return h;
}

function guess(i){
  const G = DATA.guess, g = G[i];
  return top('#/') + `<div class="wrap page"><p class="kicker">Ancient or modern?</p><p class="step">Line ${i+1} of ${G.length}</p>
  <p class="big">“${esc(g.line)}”</p><div class="two" id="gopts"><button data-g="1">Ancient scripture</button><button data-g="0">Modern saying</button></div><div id="grev"></div></div>`;
}

function verseHTML(v, idx){
  return `<div class="verse" data-v="${idx}"><div class="ref">${esc(v.ref)}</div>
   <div class="s" lang="sa" data-part="s">${v.deva.map(esc).join('<br>')}</div>
   <div class="t" data-part="t">${v.iast.map(esc).join('<br>')}</div>
   <div class="w" data-part="w" hidden>${v.gloss.map(g=>`<i>${esc(g[0])}</i> ${esc(g[1])}`).join(' · ')}</div>
   <div class="tr" data-part="tr">${esc(v.tr)}</div></div>`;
}

const STEPS=['why','source','story','means','yours'];
const STEP_LABEL={why:'Why this matters',source:'See the source verse',story:'Read the story',means:'What it really means',yours:'Make it yours'};

function drishti(n){
  const d=D[n], p=partOf(n);
  if(!S.seen.includes(n)){ S.seen.push(n); save(); }
  return top('#/') + `<article class="wrap page" id="dr">
   <p class="kicker">Dṛṣṭi ${n} of 30, Part ${p.num}: ${esc(p.name)}</p>
   <h1>${esc(d.sa)}</h1><div class="dv deva" lang="sa">${esc(d.deva)}</div><div class="en">${esc(d.en)}</div>
   <p class="idea">${esc(d.idea)}</p>
   <div id="steps"></div>
   <button class="next" id="nextbtn">${STEP_LABEL.why}</button>
   <div class="showall"><button class="link-btn" id="showall" style="color:var(--saffron)">Show everything at once</button></div>
   <div class="pn">${n>1?`<a href="#/d/${n-1}">Dṛṣṭi ${n-1}: ${esc(D[n-1].sa)}</a>`:'<span></span>'}${n<30?`<a href="#/d/${n+1}">Dṛṣṭi ${n+1}: ${esc(D[n+1].sa)}</a>`:'<span></span>'}</div>
  </article>`;
}

function stepHTML(n, key){
  const d=D[n];
  if(key==='why') return `<section class="sec"><h2>Why this matters</h2><p>${esc(d.why)}</p><ul class="apply">${d.apply.map(a=>`<li><b>${esc(a[0])}</b>${esc(a[1])}</li>`).join('')}</ul></section>`;
  if(key==='source') return `<section class="sec"><h2>The source</h2>
    <div class="toggles" role="group" aria-label="Show in the verse">
     <button class="chip" data-t="s" aria-pressed="true">Sanskrit</button><button class="chip" data-t="t" aria-pressed="true">Transliteration</button>
     <button class="chip" data-t="w" aria-pressed="false">Word meanings</button><button class="chip" data-t="tr" aria-pressed="true">Translation</button></div>
    ${d.verses.map(verseHTML).join('')}</section>`;
  if(key==='story'){
    const ci = DATA.challenges.findIndex(c=>c.d===n);
    const st = d.story;
    const full = `<div class="story"><h3>${esc(st.title)}</h3><div class="src">${esc(st.src)}</div>${st.text.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`;
    if(ci<0) return `<section class="sec"><h2>The story</h2>${full}</section>`;
    const c = DATA.challenges[ci];
    return `<section class="sec"><h2>The story</h2><p>${esc(c.setup)}</p><p class="ask">${esc(c.ask)}</p><div data-inline="${ci}">${c.options.map((o,k)=>`<button class="choice" data-iopt="${k}">${esc(o)}</button>`).join('')}</div><div class="inrev" hidden><div style="margin-top:16px">${full}</div></div></section>`;
  }
  if(key==='means') return `<section class="sec"><h2>What it really means</h2><p>${esc(d.means)}</p><h2 style="margin-top:22px">Common misreadings</h2><ul class="mis">${d.mis.map(m=>`<li><i>${esc(m[0])}</i> ${esc(m[1])}</li>`).join('')}</ul></section>`;
  if(key==='yours'){
    const on=S.trying.includes(n);
    return `<section class="sec"><h2>Make it yours</h2><div class="q">${esc(d.question)}</div>
    <div class="try"><h3>Try this</h3><div>${esc(d.tryit)}</div><button class="pill" id="trybtn" aria-pressed="${on}">${on?"I'm trying this":"I'll try this this week"}</button></div>
    <label for="note" style="display:block;margin-top:18px;font-weight:600">One line for yourself</label>
    <textarea id="note" placeholder="What did you notice?">${esc(S.notes[n]||'')}</textarea><div class="hint">Saved only on this device.</div>
    <button class="pill share" id="sharebtn">Share this Dṛṣṭi</button>
    <div class="conn"><h2>Goes well with</h2>${d.conn.map(c=>`<a href="#/d/${c}"><b>Dṛṣṭi ${c}: ${esc(D[c].sa)}</b><span>${esc(D[c].idea)}</span></a>`).join('')}</div></section>`;
  }
}

function about(){
  const v=DATA.intro;
  return top('#/') + `<div class="wrap page about"><p class="kicker">About this book</p><h1>Why Dṛṣṭi</h1>
  <p style="margin-top:16px"><i>Dṛṣṭi</i> (<span class="deva" lang="sa">दृष्टि</span>) means sight: the way one sees. The tradition holds that how we see decides how we act, and how we act shapes our life. In the Bhagavad Gītā, Arjuna's crisis is not a lack of strength or skill. It is a way of seeing, and Krishna's teaching changes that seeing before anything else changes.</p>
  ${verseHTML(v,'i')}
  <p>Each of the thirty Dṛṣṭis is a lens drawn from the scriptures: the Vedas, Upaniṣads, Itihāsas, Purāṇas and the Bhagavad Gītā. They are as useful in an office, a classroom or a family argument as they were on the field of Kurukshetra.</p>
  <h2>How each Dṛṣṭi unfolds</h2><ol><li>The idea in one line</li><li>Why it matters, and where it shows up today</li><li>The source verse, in Devanāgarī with transliteration, word meanings and translation</li><li>The story from the scriptures</li><li>What it really means, and common misreadings</li><li>A question to carry, a practice for the week, and Dṛṣṭis that go well with it</li></ol>
  <h2>Names in the verses</h2><p>Krishna addresses Arjuna by several names, kept as in the original: <i>Pārtha</i>, son of Pṛthā (Kunti); <i>Kaunteya</i>, son of Kunti; <i>Bhārata</i>, descendant of Bharata; <i>Bharatarṣabha</i>, best of the Bharatas; <i>Dhanañjaya</i>, winner of wealth; <i>Mahābāho</i>, mighty-armed one.</p>
  <h2>Sources and translation</h2><p>Translations are fresh renderings from the Sanskrit, kept close to the literal meaning. Every verse was checked against Sanskrit sources, and every story against its named text. Gītā references follow the common 700-verse numbering; Mahābhārata section numbers follow K. M. Ganguli's translation. The full book is also available as an A5 PDF.</p>
  <h2>Credits</h2>${DATA.credits.map(c=>`<p style="margin:0 0 8px"><span style="color:var(--muted);font-size:15px">${esc(c[0])}</span><br>${esc(c[1])}</p>`).join('')}<p style="color:var(--muted)">${esc(DATA.edition)}</p>
  </div>`;
}

/* ---------- router ---------- */
let cur = {view:null,n:null,step:0};
function render(){
  const h = location.hash.replace(/^#\/?/,'');
  const [view, arg] = h.split('/');
  const n = parseInt(arg,10);
  if(view==='d' && D[n]) { app.innerHTML = drishti(n); cur={view,n,step:0}; bindDrishti(n); }
  else if(view==='all') app.innerHTML = all();
  else if(view==='face') { app.innerHTML = face(); bindFace(); }
  else if(view==='story' && DATA.challenges[n]) { app.innerHTML = story(n); bindStory(n); }
  else if(view==='guess' && DATA.guess[n]) { app.innerHTML = guess(n); bindGuess(n); }
  else if(view==='about') { app.innerHTML = about(); bindToggles(app); }
  else app.innerHTML = home();
  window.scrollTo(0,0); app.focus({preventScroll:true});
}
window.addEventListener('hashchange', render);
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-go]'); if(b){ go(b.dataset.go); }
});

function bindToggles(root){
  root.querySelectorAll('.chip').forEach(ch=> ch.addEventListener('click',()=>{
    const on = ch.getAttribute('aria-pressed')!=='true'; ch.setAttribute('aria-pressed',on);
    ch.closest('section,.about').querySelectorAll(`[data-part="${ch.dataset.t}"]`).forEach(el=> el.hidden=!on);
  }));
}

function bindDrishti(n){
  const steps = document.getElementById('steps'), btn = document.getElementById('nextbtn');
  function add(){
    const key = STEPS[cur.step]; if(!key) return;
    steps.insertAdjacentHTML('beforeend', stepHTML(n,key));
    const sec = steps.lastElementChild;
    bindToggles(sec); bindInline(sec); if(key==='yours') bindYours(n);
    cur.step++;
    if(cur.step<STEPS.length){ btn.textContent = STEP_LABEL[STEPS[cur.step]]; } else { btn.remove(); const sa=document.getElementById('showall'); if(sa) sa.parentNode.remove(); }
    return sec;
  }
  btn.addEventListener('click',()=>{ const s=add(); if(s) s.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); const h=s&&s.querySelector('h2'); if(h){h.tabIndex=-1;h.focus({preventScroll:true});} });
  document.getElementById('showall').addEventListener('click',()=>{ while(cur.step<STEPS.length) add(); });
}

function bindInline(sec){
  const box = sec.querySelector('[data-inline]'); if(!box) return;
  const c = DATA.challenges[+box.dataset.inline];
  box.querySelectorAll('.choice').forEach(b=> b.addEventListener('click',()=>{
    const k=+b.dataset.iopt;
    box.querySelectorAll('.choice').forEach((x,j)=>{ x.disabled=true; if(j===c.answer) x.classList.add('right'); else if(j===k) x.classList.add('picked'); else x.classList.add('dim'); });
    const r = sec.querySelector('.inrev'); r.hidden=false;
    r.insertAdjacentHTML('afterbegin', `<div class="reveal">${k===c.answer?'<b>Yes.</b> ':''}${esc(c.reveal)}</div>`);
  }));
}

function bindYours(n){
  const t=document.getElementById('trybtn');
  t.addEventListener('click',()=>{ const on=!S.trying.includes(n); S.trying = on? [...S.trying,n] : S.trying.filter(x=>x!==n); save(); t.setAttribute('aria-pressed',on); t.textContent = on?"I'm trying this":"I'll try this this week"; if(on) toast('Noted for this week'); });
  const ta=document.getElementById('note'); let tm;
  ta.addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ S.notes[n]=ta.value; save(); },400); });
  document.getElementById('sharebtn').addEventListener('click', async ()=>{
    const d=D[n]; const url = location.href.split('#')[0] + '#/d/' + n;
    const text = `Dṛṣṭi ${n}: ${d.sa} (${d.en})\n“${d.idea}”\n\nFrom Dṛṣṭi: 30 Timeless Lenses for Modern Life`;
    if(navigator.share){ try{ await navigator.share({title:'Dṛṣṭi '+n+': '+d.sa, text, url: url.startsWith('http')?url:undefined}); }catch(e){} }
    else { try{ await navigator.clipboard.writeText(text + (url.startsWith('http')?'\n'+url:'')); toast('Copied, ready to paste'); }catch(e){ window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener'); } }
  });
}

function bindFace(){
  document.querySelectorAll('.sit').forEach(b=> b.addEventListener('click',()=>{
    const r=document.getElementById('sit'+b.dataset.sit); const open=b.getAttribute('aria-expanded')!=='true';
    b.setAttribute('aria-expanded',open); r.hidden=!open;
  }));
}

function bindStory(i){
  const C=DATA.challenges, c=C[i];
  document.querySelectorAll('#opts .choice').forEach(b=> b.addEventListener('click',()=>{
    const k=+b.dataset.opt;
    document.querySelectorAll('#opts .choice').forEach((x,j)=>{ x.disabled=true; if(j===c.answer) x.classList.add('right'); else if(j===k) x.classList.add('picked'); else x.classList.add('dim'); });
    const d=D[c.d];
    document.getElementById('rev').innerHTML = `<div class="reveal sec">${k===c.answer?'<b>Yes.</b> ':''}${esc(c.reveal)}</div>
     <a class="rowlink" href="#/d/${c.d}" style="margin-top:16px"><b>The lens: Dṛṣṭi ${c.d}, ${esc(d.sa)}</b><span>${esc(d.idea)}</span></a>
     <button class="next" data-go="${i+1<C.length?'#/story/'+(i+1):'#/'}">${i+1<C.length?'Next story':'Back to the start'}</button>`;
  }));
}

let gScore=0;
function bindGuess(i){
  if(i===0) gScore=0;
  const G=DATA.guess, g=G[i];
  document.querySelectorAll('#gopts button').forEach(b=> b.addEventListener('click',()=>{
    const pick = b.dataset.g==='1', right = pick===g.ancient; if(right) gScore++;
    document.querySelectorAll('#gopts button').forEach(x=>{ x.disabled=true; if((x.dataset.g==='1')===g.ancient) x.classList.add('right'); });
    const d=D[g.d], last=i+1>=G.length;
    document.getElementById('grev').innerHTML = `<div class="reveal sec"><b class="${right?'':'no'}">${right?'Right.':'Not quite.'}</b> ${g.ancient?'This is ancient: ':''}<i>${esc(g.src)}</i>. ${esc(g.note)}</div>
     <a class="rowlink" href="#/d/${g.d}" style="margin-top:16px"><b>Explore Dṛṣṭi ${g.d}: ${esc(d.sa)}</b><span>${esc(d.idea)}</span></a>
     ${last?`<p style="margin-top:18px">You got ${gScore} of ${G.length}. Most of these “modern” ideas are thousands of years old.</p>`:''}
     <button class="next" data-go="${last?'#/all':'#/guess/'+(i+1)}">${last?'See all 30 Dṛṣṭis':'Next line'}</button>`;
  }));
}

render();
})();
</script>
</body>
</html>
