:root{
  --night:#1B2444; --night-2:#242F57; --ink:#26221D; --muted:#6E6457; --paper:#FBF8F2; --wash:#F3EBDD;
  --saffron:#B0501A; --gold:#E2B27A; --mist:#9AA1BA; --line:#E4D8C4; --ok:#2F6B4F; --card:#FFFFFF;
  --serif:'Noto Serif','Noto Serif Devanagari',Georgia,serif; --deva:'Noto Serif Devanagari','Noto Serif',serif;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#ECE5D8; --muted:#A9A091; --paper:#141A31; --wash:#1E2745; --line:#2E3A63; --card:#1A2140; --saffron:#E39A5E; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--serif);}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}
.deva{font-family:var(--deva)}
.wrap{max-width:36rem;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- home ---------- */
.home{background:var(--night);color:#F4EEE2;min-height:100vh;padding-bottom:40px}
.home .wrap{padding-top:44px}
.eye{display:block;margin:0 0 22px 0}
.eye .lid{transform-origin:55px 30px;animation:open 1.6s cubic-bezier(.2,.7,.2,1) .2s both}
.eye .pupil{animation:glow 1.6s ease .9s both}
@keyframes open{from{transform:scaleY(.04)}to{transform:scaleY(1)}}
@keyframes glow{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.eye .lid,.eye .pupil{animation:none}}
.home h1{font-weight:500;font-size:56px;line-height:1;margin:0;letter-spacing:.01em;color:#FFF8EC}
.home .dvn{font-size:28px;color:var(--gold);margin-top:6px}
.home .tag{font-size:18px;font-style:italic;color:#D9D2C4;margin:18px 0 0;max-width:26rem}
.home h2{font-weight:500;font-size:22px;margin:40px 0 14px;color:#FFF8EC}
.door{display:block;width:100%;text-align:left;background:var(--night-2);border:1px solid #33407A;border-radius:14px;padding:16px 18px;margin:0 0 12px;cursor:pointer;color:#F4EEE2}
.door:hover{border-color:var(--gold)}
.door b{display:block;font-weight:600;font-size:18px;color:#FFF8EC}
.door span{display:block;font-size:15px;color:#BFC4D6;margin-top:2px}
.week{margin-top:28px;border-top:1px solid #33407A;padding-top:20px}
.week small{color:var(--gold);font-style:italic;font-size:15px}
.week .nm{font-size:22px;margin:2px 0 4px;color:#FFF8EC}
.week p{margin:0 0 12px;color:#D9D2C4}
.link-btn{background:none;border:0;padding:0;cursor:pointer;color:var(--gold);text-decoration:underline;text-underline-offset:3px;font-size:16px}
.allrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px;gap:12px;flex-wrap:wrap}
.allrow .count{color:#BFC4D6;font-size:15px}
.credits{margin-top:44px;font-size:12.5px;line-height:1.55;color:#8E95AE}
.credits div{margin-bottom:6px}
.credits em{font-style:normal;color:#B8BDCF}

/* ---------- inner pages ---------- */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:52px}
.top button{background:none;border:0;cursor:pointer;font-size:16px;color:var(--muted);padding:8px 0}
.top button:hover{color:var(--saffron)}
.page{padding-top:26px;padding-bottom:70px}
.kicker{font-size:15px;font-style:italic;color:var(--saffron);margin:0 0 4px}
.page h1{font-weight:500;font-size:38px;line-height:1.1;margin:0;color:var(--ink)}
.page .dv{font-size:22px;color:var(--saffron);margin-top:4px}
.page .en{font-style:italic;color:var(--muted);font-size:18px;margin-top:2px}
.idea{font-size:23px;line-height:1.4;margin:24px 0 8px;padding-left:16px;border-left:3px solid var(--saffron)}
.sec{margin-top:30px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.sec{animation:none}}
.sec h2{font-weight:600;font-size:19px;margin:0 0 10px;color:var(--ink)}
.apply{margin:12px 0 0;padding:0;list-style:none}
.apply li{padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.apply b{font-weight:600;color:var(--saffron);margin-right:6px}
.next{display:block;width:100%;margin-top:28px;padding:15px 18px;border-radius:12px;border:1.5px solid var(--saffron);background:transparent;color:var(--saffron);font-size:17px;font-weight:600;cursor:pointer;text-align:left}
.next:hover{background:var(--saffron);color:#fff}
.showall{margin-top:12px}

.verse{background:var(--wash);border-radius:14px;padding:18px 18px 16px;margin:6px 0 14px}
.verse .ref{font-size:14px;font-style:italic;color:var(--saffron);margin-bottom:10px}
.verse .s{font-family:var(--deva);font-size:20px;line-height:1.8;text-align:center}
.verse .t{font-style:italic;color:var(--muted);text-align:center;font-size:15.5px;margin-top:8px;line-height:1.55}
.verse .w{font-size:14.5px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line);line-height:1.6}
.verse .w i{color:var(--ink)}
.verse .tr{margin-top:12px;font-size:17px}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--saffron);color:var(--saffron);background:transparent}

.story{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.story h3{margin:0;font-size:18px;font-weight:600}
.story .src{font-size:14px;color:var(--muted);font-style:italic;margin:2px 0 12px}
.story p{margin:0 0 10px}

.choice{display:block;width:100%;text-align:left;margin:8px 0 0;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16.5px}
.choice:hover:not([disabled]){border-color:var(--saffron)}
.choice[disabled]{cursor:default}
.choice.right{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.choice.picked:not(.right){opacity:.75;text-decoration:line-through;text-decoration-color:var(--muted)}
.choice.dim{opacity:.55}
.reveal{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--wash)}
.reveal b{color:var(--ok)}
.reveal b.no{color:var(--saffron)}
.ask{font-size:20px;font-weight:600;margin:14px 0 4px}

.mis{list-style:none;padding:0;margin:0}
.mis li{padding:9px 0;border-top:1px solid var(--line);font-size:16px}
.mis li i{color:var(--muted)}

.q{background:var(--night);color:#F4EEE2;border-radius:14px;padding:18px;font-size:20px;font-style:italic;line-height:1.45}
.try{margin-top:14px;padding:16px;border-radius:14px;background:var(--wash)}
.try h3{margin:0 0 6px;font-size:16px;font-weight:600;color:var(--saffron)}
.pill{margin-top:12px;border:1.5px solid var(--saffron);background:transparent;color:var(--saffron);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:15px}
.pill[aria-pressed="true"]{background:var(--saffron);color:#fff}
textarea{width:100%;margin-top:14px;min-height:76px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px;font:inherit;font-size:16px;resize:vertical}
.hint{font-size:13.5px;color:var(--muted);margin-top:4px}
.share{margin-top:16px}
.conn{margin-top:30px}
.conn a,.rowlink{display:block;text-decoration:none;padding:12px 0;border-top:1px solid var(--line)}
.conn a b,.rowlink b{font-weight:600}
.conn a span,.rowlink span{display:block;color:var(--muted);font-size:15px}
.pn{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
.pn a{text-decoration:none;color:var(--saffron);font-size:15.5px}

.part{margin-top:30px}
.part h2{font-weight:600;font-size:19px;margin:0}
.part p{margin:0 0 6px;color:var(--muted);font-style:italic;font-size:15.5px}
.grid a{display:grid;grid-template-columns:2.2rem 1fr auto;gap:6px;align-items:baseline;text-decoration:none;padding:11px 0;border-top:1px solid var(--line)}
.grid .n{color:var(--saffron);font-weight:600}
.grid .e{display:block;color:var(--muted);font-style:italic;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);display:inline-block}
.dot.on{background:var(--saffron);border-color:var(--saffron)}

.sit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;margin:10px 0 0;cursor:pointer}
.sit b{display:block;font-weight:600;font-size:17px}
.sit span{display:block;color:var(--muted);font-size:15px}
.sit[aria-expanded="true"]{border-color:var(--saffron)}
.sitres{padding:4px 4px 6px 16px;border-left:2px solid var(--saffron);margin:8px 0 6px}

.big{font-size:27px;line-height:1.35;margin:22px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
.two button:hover:not([disabled]){border-color:var(--saffron)}
.two button.right{border-color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
.step{color:var(--muted);font-size:15px}
.about p{margin:0 0 14px}
.about h2{font-weight:600;font-size:19px;margin:30px 0 10px}
.about ol{padding-left:22px}
.about li{margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<main id="app" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="data" type="application/json">{"d": {"1": {"sa": "Samatvam", "deva": "समत्वम्", "en": "Equanimity", "idea": "Stay steady whether things go your way or not.", "why": "Much of our suffering comes from riding every high and crashing with every low. A promotion lifts us for a week; one harsh comment can spoil a month. A mind that swings with every result cannot think clearly, and it makes its worst decisions at the extremes.", "apply": [["Work", "A rejected proposal or a missed target: respond to the facts, not to the sting."], ["Money", "Markets rise and fall. Panic-selling and greed-buying are both a loss of samatvam."], ["Relationships", "Praise and criticism from people you love, taken with the same steadiness."], ["Mind and health", "An exam result, a medical report, a setback in training."]], "verses": [{"ref": "Bhagavad Gītā 2.48", "deva": ["योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय ।", "सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते ॥"], "iast": ["yogasthaḥ kuru karmāṇi saṅgaṃ tyaktvā dhanañjaya", "siddhy-asiddhyoḥ samo bhūtvā samatvaṃ yoga ucyate"], "gloss": [["yogasthaḥ", "established in yoga"], ["saṅgaṃ tyaktvā", "giving up attachment"], ["siddhi-asiddhyoḥ", "in success and failure"], ["samaḥ", "even, the same"], ["samatvam", "evenness of mind"]], "tr": "Established in yoga, do your work, O Dhanañjaya, giving up attachment. Remain the same in success and failure. This evenness of mind is called yoga."}], "means": "Samatvam is not indifference. Krishna asks Arjuna to act with full effort; what he asks him to drop is attachment to how it turns out. The verse follows straight from 2.47: once we accept that our right (adhikāra) is to the action and never to its fruit, we can offer the work to the Lord and accept what comes as His will. That acceptance, not a lack of feeling, is what makes the mind steady.", "question": "Would I still act this way, and feel this way, if the result went the other way?", "story": {"title": "Rama receives the news of exile", "src": "Rāmāyaṇa, Ayodhyā Kāṇḍa", "text": ["On the eve of Rama's coronation as crown prince, Queen Kaikeyi claimed the two boons King Dasharatha had once promised her: Bharata would be crowned, and Rama would live in the forest for fourteen years.", "Rama was summoned and told. In a few sentences he lost a throne and gained an exile. Valmiki describes him receiving the news without anger or grief clouding his face. He accepted his father's word, comforted his mother, and prepared to leave.", "Rama was not made of stone; he felt for his parents and his people. But his steadiness came from knowing what was right to do, not from what he was getting. A crown or a forest did not change who he was."]}, "mis": [["“Equanimity means not caring.”", "Rama cared enough to protect his father's word at great cost to himself."], ["“Stay calm by bottling up feelings.”", "Samatvam is a steadiness beneath feelings, not a denial of them."]], "tryit": "Each evening this week, write one thing that went well and one that went badly. Beside each, write the karma (what you did), not the karma-phala (what came of it). Notice that the Gita gives you a right only to the first.", "conn": [9, 7, 2]}, "2": {"sa": "Uddhared Ātmanā", "deva": "उद्धरेदात्मना", "en": "Your Mind: Friend or Foe", "idea": "Your own mind can be your best friend or your worst enemy. Lift yourself up with it.", "why": "We look for rescue outside ourselves: the right job, the right city, the right partner, the right app. Some of that helps. But the inner voice that says “you'll fail anyway” or “one more scroll won't hurt” travels with us everywhere. Unless we take charge of it, no outside change lasts.", "apply": [["Work", "Procrastination and self-doubt before a big presentation."], ["Money", "An impulse purchase: who is deciding, you or the urge?"], ["Relationships", "Replaying an argument at 2 a.m. instead of resolving it."], ["Health", "Restarting a habit after a lapse instead of giving up."]], "verses": [{"ref": "Bhagavad Gītā 6.5–6", "deva": ["उद्धरेदात्मनाऽऽत्मानं नात्मानमवसादयेत् ।", "आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः ॥", "बन्धुरात्माऽऽत्मनस्तस्य येनात्मैवात्मना जितः ।", "अनात्मनस्तु शत्रुत्वे वर्तेतात्मैव शत्रुवत् ॥"], "iast": ["uddhared ātmanātmānaṃ nātmānam avasādayet", "ātmaiva hy ātmano bandhur ātmaiva ripur ātmanaḥ", "bandhur ātmātmanas tasya yenātmaivātmanā jitaḥ", "anātmanas tu śatrutve vartetātmaiva śatruvat"], "gloss": [["uddharet", "should lift up"], ["ātmanā", "by oneself (here: by one's own mind)"], ["avasādayet", "should let sink"], ["bandhuḥ", "friend"], ["ripuḥ / śatru", "enemy"], ["jitaḥ", "mastered"]], "tr": "Lift yourself up by your own mind; do not let yourself sink. The mind alone is the friend of the self, and the mind alone is its enemy. For one who has mastered the mind, the mind is a friend. For one who has not, that same mind behaves like an enemy."}], "means": "The word ātman in these verses is widely read as the mind. The verse puts responsibility squarely on us: no one else can do our inner work. The same mind that drags us down can lift us up, not by willpower alone but by training it, guided by the scriptures, a teacher and the grace of the Lord. Mastering the mind does not mean crushing it; it means turning it into an ally.", "question": "Is my mind working for me right now, or against me?", "story": {"title": "Dhruva", "src": "Bhāgavata Purāṇa, Canto 4, chapters 8–9", "text": ["Five-year-old Dhruva tried to climb onto the lap of his father, King Uttanapada. His stepmother Suruchi pulled him away and told him that only her son deserved that place.", "Stung, Dhruva ran to his mother Suniti. She told him not to wish ill on anyone, and to seek the Lord instead. The boy left for the forest. On the way the sage Narada tested him, warning that he was far too young; Dhruva would not turn back. Narada then taught him a mantra and how to meditate, and Dhruva practised with such single-minded steadiness that Vishnu appeared before him.", "Dhruva could have stayed small inside that insult for the rest of his life. Instead he used the hurt as a push to lift himself up. He went on to be honoured with a place as the Pole Star."]}, "mis": [["“I can do it all by myself.”", "The verse is about self-effort, not self-sufficiency. Dhruva needed his mother's guidance, Narada's teaching and the Lord's grace."], ["“The mind is the problem.”", "The mind is an enemy only when untrained. Trained, it is the best friend you have."]], "tryit": "Name your inner critic's favourite sentence. Each time it shows up this week, answer it once, in writing, the way a good friend would.", "conn": [5, 14, 8]}, "5": {"sa": "Abhyāsa & Vairāgya", "deva": "अभ्यास वैराग्य", "en": "Practice and Letting Go", "idea": "The mind is trained by two things together: doing the right thing again and again, and loosening your grip on what pulls you away.", "why": "We try to change in bursts: an inspired weekend, a New Year resolution. Then it fades. Krishna does not deny the difficulty; he agrees with Arjuna that the mind is hard to hold. His answer is a method with two parts. Practice without letting go becomes a tug-of-war. Letting go without practice leaves a vacuum.", "apply": [["Work", "A daily block of focused work (practice), with the phone in another room (letting go)."], ["Health", "A daily walk, and not keeping junk food at home."], ["Learning", "Steady daily practice of a skill, and less comparison with others."], ["Money", "Automatic saving, and unsubscribing from sale emails."]], "verses": [{"ref": "Bhagavad Gītā 6.34 (Arjuna) and 6.35 (Krishna)", "deva": ["चञ्चलं हि मनः कृष्ण प्रमाथि बलवद्दृढम् ।", "तस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम् ॥", "असंशयं महाबाहो मनो दुर्निग्रहं चलम् ।", "अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते ॥"], "iast": ["cañcalaṃ hi manaḥ kṛṣṇa pramāthi balavad dṛḍham", "tasyāhaṃ nigrahaṃ manye vāyor iva suduṣkaram", "asaṃśayaṃ mahābāho mano durnigrahaṃ calam", "abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate"], "gloss": [["cañcalam", "restless"], ["durnigraham", "hard to restrain"], ["abhyāsena", "by steady practice"], ["vairāgyeṇa", "by detachment"], ["gṛhyate", "is held, brought under control"]], "tr": "Arjuna: “The mind is restless, O Kṛṣṇa — turbulent, strong and stubborn. Holding it seems to me as hard as holding the wind.” Krishna: “Without doubt, mighty-armed one, the mind is restless and hard to hold. But, son of Kunti, it is held by practice and by detachment.”"}], "means": "Abhyāsa is steady, repeated effort in one direction. Vairāgya is a cooling of desire for whatever pulls you off course: not hatred of the world, but seeing clearly that those things cannot give you what you want from them. Notice that Krishna never calls the mind uncontrollable. He says it is hard. Hard things are done by repetition.", "question": "What is my practice, and what do I need to let go of so that the practice can work?", "story": {"title": "Arjuna practises in the dark", "src": "Mahābhārata, Ādi Parva", "text": ["While Arjuna was a student of Drona, a gust of wind blew out the lamp as he sat eating his meal. He went on eating; his hand found his mouth in the dark without any trouble.", "He realised this was nothing but habit, built by repetition. If his hand could learn to find his mouth in darkness, it could learn to find a target too. From then on he practised archery at night.", "Drona, seeing his dedication, promised to make him an unmatched archer. Arjuna's skill was not magic. It was abhyāsa, and his readiness to give up comfort and sleep for it was his vairāgya."]}, "mis": [["“Vairāgya means leaving home or job.”", "In the Gita it is inner detachment while doing your duty."], ["“Practice means quick perfection.”", "It means coming back again and again, especially after a lapse."]], "tryit": "Choose one ten-minute practice and do it daily at the same time. Remove one easy distraction from your surroundings. Mark each day you do it.", "conn": [2, 14, 1]}, "7": {"sa": "Santoṣa", "deva": "सन्तोष", "en": "Contentment", "idea": "Happiness comes from enough, not from more.", "why": "The finish line keeps moving: the next salary, the bigger flat, the newer phone. Social media shows us everyone else's best moments every hour. Without contentment, every success only resets the hunger. The verse names envy (matsara) for a reason: it turns other people's good fortune into our pain.", "apply": [["Money", "Decide what “enough” means before you need to."], ["Career", "Compare yourself with your own past, not with a colleague's feed."], ["Relationships", "Value the people you have instead of imagining better ones."], ["Home", "Wait a week before any non-essential purchase."]], "verses": [{"ref": "Bhagavad Gītā 4.22", "deva": ["यदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः ।", "समः सिद्धावसिद्धौ च कृत्वापि न निबध्यते ॥"], "iast": ["yadṛcchā-lābha-santuṣṭo dvandvātīto vimatsaraḥ", "samaḥ siddhāv asiddhau ca kṛtvāpi na nibadhyate"], "gloss": [["yadṛcchā-lābha", "gain that comes unsought"], ["santuṣṭaḥ", "content"], ["dvandva-atītaḥ", "beyond the pairs of opposites"], ["vimatsaraḥ", "free from envy"], ["na nibadhyate", "is not bound"]], "tr": "Content with whatever comes on its own, beyond the pairs of opposites, free from envy, the same in success and failure: such a person, even while acting, is not bound."}], "means": "Santoṣa is not laziness or lack of ambition. The verse describes someone who acts (kṛtvāpi, “even while acting”). You keep working fully; you simply stop making your peace depend on getting more. The content person receives what comes from right effort as the Lord's gift, and does not envy what others have.", "question": "If this were all I ever got, could I be at peace with it?", "story": {"title": "Sudama visits Krishna", "src": "Bhāgavata Purāṇa, Canto 10, chapters 80–81", "text": ["Sudama, a poor brahmin and Krishna's childhood friend, lived content with almost nothing. At his wife's urging he walked to Dwaraka to see Krishna, carrying only a handful of flattened rice tied in a cloth as a gift.", "Krishna ran to embrace him, washed his feet and joyfully ate the rice. The two friends talked about their days with their teacher. Sudama never asked for anything, and set off home happy simply to have seen his friend.", "Only on reaching home did he find his hut transformed into a mansion. Even then he lived without attachment to the new wealth, remembering Krishna. His contentment did not come from his fortune; it came before it."]}, "mis": [["“Contentment means settling for less.”", "The content person still works fully; only the craving goes."], ["“Contentment means accepting injustice.”", "It applies to your own wants, not to tolerating wrong done to others."]], "tryit": "Each night this week, write three things you already have and would miss. Delay every non-essential purchase by seven days.", "conn": [1, 26, 27]}, "8": {"sa": "Viveka", "deva": "विवेक", "en": "Discernment", "idea": "Learn to tell apart what helps from what harms, and what binds from what frees, before you act.", "why": "We face far more choices every day than any earlier generation, and many are designed to feel good now and cost later. Information is plentiful; judgment is scarce. Without viveka, intelligence only helps us justify what we already wanted.", "apply": [["Work", "Telling what truly matters from what merely feels urgent."], ["Money", "Investment versus speculation; need versus want."], ["News and social media", "Telling evidence from noise."], ["Relationships", "Knowing when to speak up and when to stay silent."]], "verses": [{"ref": "Bhagavad Gītā 18.30", "deva": ["प्रवृत्तिं च निवृत्तिं च कार्याकार्ये भयाभये ।", "बन्धं मोक्षं च या वेत्ति बुद्धिः सा पार्थ सात्त्विकी ॥"], "iast": ["pravṛttiṃ ca nivṛttiṃ ca kāryākārye bhayābhaye", "bandhaṃ mokṣaṃ ca yā vetti buddhiḥ sā pārtha sāttvikī"], "gloss": [["pravṛtti / nivṛtti", "engaging in action / holding back"], ["kārya-akārye", "what should and should not be done"], ["bhaya-abhaye", "what to fear and what not to fear"], ["bandham mokṣam", "what binds and what frees"], ["vetti", "knows"]], "tr": "The intellect that knows when to act and when to hold back, what should be done and what should not, what to fear and what not to fear, what binds and what frees: that intellect, Pārtha, is sāttvic, clear."}], "means": "The Gita describes three kinds of intellect (18.30–32). The clear one sees right and wrong as they are. The restless (rājasic) one mixes them up. The dark (tāmasic) one sees things upside down, taking wrong for right. Viveka is the clear one. It is not cleverness; a clever person can argue for anything. It is seeing what an action will really lead to, above all whether it binds you or frees you. The scriptures and a good teacher are its training ground.", "question": "Will this bind me or free me? Will I be glad I did this a year from now?", "story": {"title": "Yudhishthira and the Yaksha", "src": "Mahābhārata, Vana Parva", "text": ["During the forest exile, four of the Pandava brothers drank from a lake although a voice warned them to answer its questions first. One by one they fell lifeless. Yudhishthira came last, and agreed to answer.", "He answered a long series of questions about life and dharma. Pleased, the Yaksha offered to bring back one brother, just one. Everyone would have expected him to choose mighty Bhima or Arjuna, the warriors he would need most.", "Yudhishthira chose Nakula. His reasoning: his father had two wives. He, a son of Kunti, was alive; Madri's line should also have a living son. Moved by this fairness, the Yaksha revealed himself as Dharma and restored all four brothers. Yudhishthira's choice was not the obviously useful one. It was the right one, and he could tell the difference."]}, "mis": [["“Discernment means doubting everything.”", "Viveka is clear seeing, not suspicion."], ["“It's purely intellectual.”", "The Gita ties a clear intellect to a clear, sāttvic mind and way of life."]], "tryit": "Before one decision each day, write two lines: what you want right now, and what you will wish you had done a year from now. If they differ, pause.", "conn": [12, 28, 2]}, "9": {"sa": "Niṣkāma Karma", "deva": "निष्काम कर्म", "en": "Act Without Craving the Result", "idea": "Give the work your best; let go of craving the result.", "why": "When the reward is all we care about, three things go wrong: anxiety rises, we are tempted to cut corners, and if the result does not come we feel the effort was wasted and give up. The verse's last line closes the escape route too: “then why act at all?” is also ruled out.", "apply": [["Exams and interviews", "Prepare fully, then let go of the outcome."], ["Creative work", "Make the thing well, not only for likes."], ["Business and sales", "Your right is to the karma: the calls, the craft, the honest pitch. The sale is its phala."], ["Parenting", "Give your best; your child's path is their own."]], "verses": [{"ref": "Bhagavad Gītā 2.47", "deva": ["कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।", "मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥"], "iast": ["karmaṇy evādhikāras te mā phaleṣu kadācana", "mā karma-phala-hetur bhūr mā te saṅgo 'stv akarmaṇi"], "gloss": [["karmaṇi", "in action"], ["adhikāraḥ", "right, entitlement"], ["phaleṣu", "in the fruits"], ["hetuḥ", "motive"], ["akarmaṇi", "in not acting"]], "tr": "Your right is to the action alone, never to its fruits. Do not let the fruit be your motive, and do not be attached to not acting."}], "means": "Four instructions are packed into one verse: you have a right to act; you have no claim on the result; do not make the result your driving reason; and do not fall into doing nothing. Results depend on many factors beyond us: other people's choices, timing and, finally, the Lord. Doing the work as an offering to Him, because it is right, frees us from both anxiety and laziness.", "question": "If no one ever saw or rewarded this, would I still do it, and do it well?", "story": {"title": "Hanuman's leap", "src": "Rāmāyaṇa, Sundara and Yuddha Kāṇḍas", "text": ["Hanuman leapt across the ocean to find Sita. On the way the mountain Mainaka rose from the sea and offered him rest. Hanuman touched it in respect and flew on; he would not pause until the task was done.", "He found Sita in Lanka, gave her Rama's ring and, with it, her hope. When he returned and reported to Rama, Rama embraced him, saying that this embrace was all he had to give.", "Hanuman wanted nothing more. He never treated the mission as his own achievement. For him it was service to Rama, and that was its own reward."]}, "mis": [["“Don't care about results, don't plan.”", "Planning and caring about quality are part of good action."], ["“Results don't matter.”", "They matter, but your adhikāra, your right, is to the action, never to its fruit."]], "tryit": "Pick one task this week. Before you start, write what “doing it well” means. Afterwards, judge yourself only on the karma, the action itself, not on its phala, the response.", "conn": [1, 25, 10]}, "10": {"sa": "Svadharma", "deva": "स्वधर्म", "en": "Your Own Path", "idea": "Better to walk your own path sincerely than to walk someone else's path well.", "why": "Young adults are pulled in every direction: parents' expectations, friends' careers, influencers' lifestyles. It is easy to chase a borrowed life and feel empty even when it succeeds. Many mid-life crises begin here.", "apply": [["Career", "Choosing work that fits your nature and responsibilities, not only what impresses others."], ["Comparison", "Measuring yourself against your own duty, not a peer's path."], ["Family roles", "Each role, as child, parent or partner, carries its own duties."], ["Teams", "Doing your part fully instead of doing someone else's job badly."]], "verses": [{"ref": "Bhagavad Gītā 3.35", "deva": ["श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात् ।", "स्वधर्मे निधनं श्रेयः परधर्मो भयावहः ॥"], "iast": ["śreyān svadharmo viguṇaḥ paradharmāt svanuṣṭhitāt", "svadharme nidhanaṃ śreyaḥ paradharmo bhayāvahaḥ"], "gloss": [["śreyān", "better"], ["svadharmaḥ", "one's own duty"], ["viguṇaḥ", "imperfect"], ["svanuṣṭhitāt", "than well performed"], ["bhaya-āvahaḥ", "fraught with danger"]], "tr": "Better is one's own dharma, even done imperfectly, than another's dharma done well. Better even to die in one's own dharma; another's dharma is full of danger."}], "means": "Svadharma is the duty that fits your nature, abilities and stage of life, including your responsibilities to the people who depend on you. It is not “whatever I like”; it is what is yours to do, hard parts included. Arjuna wanted to leave a protector's duty for a mendicant's life. For a renunciate that life is noble; for Arjuna at that moment it would have been a flight.", "question": "Is this truly mine to do, or am I borrowing someone else's life?", "story": {"title": "Arjuna wants to walk away", "src": "Bhagavad Gītā, chapters 1–3", "text": ["Seeing his teachers and relatives in the opposing army, Arjuna told Krishna it would be better to live on alms than to kill them (Gītā 2.5).", "A mendicant's life is respected in the tradition, but it was not Arjuna's. He was a kshatriya, a protector, facing an unjust ruler who had refused the Pandavas even five villages. Leaving the field would have looked noble, but it would have abandoned the people relying on him to stand against adharma.", "Krishna's teaching, including this verse, brought Arjuna back to his own duty."]}, "mis": [["“Svadharma means doing whatever I feel like.”", "It is about duty, not mere preference."], ["“It locks you into one role forever.”", "Duties change with your stage of life and circumstances."]], "tryit": "List your three main roles. For each, write one duty you have been avoiding, and one thing you do only because others are doing it.", "conn": [9, 8, 27]}, "12": {"sa": "Śreyas & Preyas", "deva": "श्रेयस् प्रेयस्", "en": "The Good and the Pleasant", "idea": "Choose what is good for you over what merely feels good.", "why": "Almost every modern product competes on preyas: the snack, the scroll, the binge-watch, buy-now-pay-later. Each choice is small. Together they decide our health, our money and our character.", "apply": [["Health", "Food, sleep and exercise choices."], ["Money", "Borrowing for pleasure versus saving for what matters."], ["Time", "Entertainment versus learning and rest."], ["Relationships", "An honest conversation versus avoiding the discomfort."]], "verses": [{"ref": "Kaṭha Upaniṣad 1.2.2", "deva": ["श्रेयश्च प्रेयश्च मनुष्यमेतस्तौ सम्परीत्य विविनक्ति धीरः ।", "श्रेयो हि धीरोऽभि प्रेयसो वृणीते प्रेयो मन्दो योगक्षेमाद्वृणीते ॥"], "iast": ["śreyaś ca preyaś ca manuṣyam etas tau samparītya vivinakti dhīraḥ", "śreyo hi dhīro 'bhi preyaso vṛṇīte preyo mando yogakṣemād vṛṇīte"], "gloss": [["śreyas", "the good, the beneficial"], ["preyas", "the pleasant"], ["vivinakti", "tells apart"], ["dhīraḥ", "the wise, steady one"], ["mandaḥ", "the short-sighted"], ["yogakṣema", "getting and keeping things"]], "tr": "The good and the pleasant both come to a person. The wise one examines them and tells them apart. The wise chooses the good over the pleasant; the short-sighted chooses the pleasant, for the sake of getting and keeping."}], "means": "The Upanishad does not say pleasant things are bad. It says that when the two conflict, choose the good. Notice the word vivinakti, “tells apart”: this Dṛṣṭi rests on Viveka (Dṛṣṭi 8). The Gita says the same in other words (18.37–38): the happiness of goodness is like poison at first and nectar in the end; the happiness of passion is nectar at first and poison in the end.", "question": "Is this good, or only pleasant? How will I feel about it tomorrow?", "story": {"title": "Nachiketa refuses Yama's gifts", "src": "Kaṭha Upaniṣad, 1.1–1.2", "text": ["Young Nachiketa watched his father Vajashravas give away old, worn-out cows as gifts in a sacrifice. Troubled, the boy asked, “To whom will you give me?” Asked again and again, his irritated father snapped, “To Death!”", "Nachiketa went to the house of Yama and waited three days without food while Yama was away. To make amends, Yama offered three boons. For the third, Nachiketa asked what happens to a person after death.", "Yama tried to put him off, offering long life, sons and grandsons, cattle, gold, a kingdom and every pleasure. Nachiketa refused it all: these things wear out, he said; keep them. Yama, delighted, praised him for choosing śreyas, and taught him."]}, "mis": [["“Pleasure is wrong.”", "Enjoyment within dharma is fine (see Dṛṣṭi 27)."], ["“The good is always unpleasant.”", "Often it becomes the deepest satisfaction of all."]], "tryit": "Spot your most common preyas trap. Once a day this week, replace it with a śreyas choice, and notice how you feel an hour later.", "conn": [8, 14, 27]}, "13": {"sa": "Karma", "deva": "कर्म", "en": "As You Act, So You Become", "idea": "Your actions shape not only your circumstances but who you become.", "why": "We often picture karma as a cosmic scoreboard. The Upanishad offers a sharper insight: every action trains you. Lie once and the next lie is easier; help once and the next kindness is easier. The chain of desire, resolve, action and result is how habits, character and lives are built.", "apply": [["Habits", "Small daily actions compound over years."], ["Integrity at work", "Repeated shortcuts become identity."], ["Relationships", "How you treat people shapes how they treat you."], ["Family", "Children learn from what you do more than from what you say."]], "verses": [{"ref": "Bṛhadāraṇyaka Upaniṣad 4.4.5 (excerpts)", "deva": ["यथाकारी यथाचारी तथा भवति ।", "साधुकारी साधुर्भवति पापकारी पापो भवति ।", "स यथाकामो भवति तत्क्रतुर्भवति ।", "यत्क्रतुर्भवति तत्कर्म कुरुते । यत्कर्म कुरुते तदभिसम्पद्यते ॥"], "iast": ["yathākārī yathācārī tathā bhavati", "sādhukārī sādhur bhavati pāpakārī pāpo bhavati", "sa yathākāmo bhavati tatkratur bhavati", "yatkratur bhavati tat karma kurute, yat karma kurute tad abhisampadyate"], "gloss": [["yathākārī", "as one acts"], ["yathācārī", "as one conducts oneself"], ["sādhukārī", "one who does good"], ["kratuḥ", "resolve, will"], ["abhisampadyate", "reaches, attains"]], "tr": "As one acts and as one conducts oneself, so one becomes. One who does good becomes good; one who does wrong becomes wrong. As is a person's desire, so is their resolve; as is their resolve, so are their deeds; and whatever deeds they do, that they attain."}], "means": "The passage traces a chain: desire shapes resolve, resolve shapes action, action shapes what you reach. So to change results, work upstream, on what you desire and resolve. The tradition adds that actions bear fruit in time, sometimes much later, under the Lord's justice; nothing is lost. As the Gita puts it (6.40), no one who does good ever comes to a bad end.", "question": "If I repeat this action every day for a year, who will I become?", "story": {"title": "Dasharatha's arrow", "src": "Rāmāyaṇa, Ayodhyā Kāṇḍa, sargas 63–64", "text": ["As a young prince, Dasharatha was proud of his skill at shooting at a target by sound alone. One night by the river Sarayu, he heard what sounded like an elephant drinking and loosed an arrow.", "It was a young ascetic filling a water pot for his blind, elderly parents. Dying, the boy told Dasharatha he need not fear having killed a brahmin, for his father was a vaiśya and his mother a śūdra, and asked him to carry the water to his parents. (Valmiki does not name him; later retellings call him Shravana Kumar.) The grief-stricken father declared that Dasharatha too would one day die in sorrow for a son.", "Decades later, near death after Rama's departure into exile, Dasharatha told Kausalya this story, recognising in his grief the fruit of that long-ago act."]}, "mis": [["“Karma means everything is fixed.”", "The passage itself says your present actions shape your future. Choice is powerful."], ["“People deserve their suffering, so why help?”", "The same tradition commands compassion and giving (Dṛṣṭi 20)."]], "tryit": "Choose one small action you want to become part of who you are. Do it every day this week. By day seven, notice whether it feels more natural.", "conn": [9, 5, 28]}, "14": {"sa": "Indriya-nigraha", "deva": "इन्द्रियनिग्रह", "en": "Self-Mastery", "idea": "Be able to draw your senses back, as a tortoise draws in its limbs, whenever you choose.", "why": "Our senses are under constant pressure: notifications, advertising, food engineered to be irresistible. The person who cannot say no to their senses cannot say yes to their goals.", "apply": [["Digital life", "Notifications off; screen-free hours."], ["Food", "Eating for nourishment, not only for taste."], ["Anger", "Not reacting instantly to provocation."], ["Spending", "Pausing between the urge and the purchase."]], "verses": [{"ref": "Bhagavad Gītā 2.58", "deva": ["यदा संहरते चायं कूर्मोऽङ्गानीव सर्वशः ।", "इन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता ॥"], "iast": ["yadā saṃharate cāyaṃ kūrmo 'ṅgānīva sarvaśaḥ", "indriyāṇīndriyārthebhyas tasya prajñā pratiṣṭhitā"], "gloss": [["saṃharate", "draws back"], ["kūrmaḥ", "tortoise"], ["aṅgāni", "limbs"], ["indriyāṇi", "the senses"], ["indriya-arthebhyaḥ", "from their objects"], ["prajñā pratiṣṭhitā", "wisdom is established"]], "tr": "When one can withdraw the senses from their objects completely, as a tortoise draws in its limbs, that person's wisdom is firmly established."}, {"ref": "Bṛhadāraṇyaka Upaniṣad 5.2.3", "deva": ["तदेतदेवैषा दैवी वागनुवदति स्तनयित्नुर्द द द इति दाम्यत दत्त दयध्वमिति ।", "तदेतत्त्रयं शिक्षेद्दमं दानं दयामिति ॥"], "iast": ["tad etad evaiṣā daivī vāg anuvadati stanayitnur da da da iti dāmyata datta dayadhvam iti", "tad etat trayaṃ śikṣed damaṃ dānaṃ dayām iti"], "gloss": [["daivī vāk", "the divine voice"], ["stanayitnuḥ", "thunder"], ["dāmyata", "be self-controlled"], ["datta", "give"], ["dayadhvam", "be compassionate"], ["śikṣet", "one should learn"]], "tr": "The divine voice of thunder repeats this: “Da! Da! Da!”, that is, be self-controlled, give, be compassionate. One should learn these three: self-control, giving and compassion."}], "means": "The tortoise does not cut off its limbs. It draws them in when there is danger and puts them out again when it is safe. Self-mastery is the same: not destroying the senses, but being able to withdraw them at will. The very next verse (2.59) adds that craving fully fades only when one tastes something higher, which for the Gita is the Lord.", "question": "Am I choosing this, or is it choosing me?", "story": {"title": "Prajapati's thunder: “Da, Da, Da”", "src": "Bṛhadāraṇyaka Upaniṣad 5.2", "text": ["The gods, humans and asuras once lived as students with their father, Prajapati. At the end of their studies, each asked him for a teaching.", "To the gods he spoke a single syllable: “Da.” They understood: dāmyata, control yourselves. To humans he said “Da,” and they understood datta, give. To the asuras he said “Da,” and they understood dayadhvam, be compassionate. Each heard what they most needed.", "As the source verse says, the thunder repeats it still, so all three are to be learned. It is telling that the gods, who had every pleasure, were the ones who most needed self-control."]}, "mis": [["“Self-control means harshness to yourself.”", "The Gita warns against extremes of eating or fasting, oversleeping or staying awake (6.16)."], ["“It's all willpower.”", "Arranging your surroundings well, and finding a higher taste, help far more."]], "tryit": "One hour a day with the phone in another room. One meal a day eaten slowly, without a screen.", "conn": [5, 12, 20]}, "17": {"sa": "Satya", "deva": "सत्य", "en": "Truth", "idea": "Truth alone wins in the end, and it is the only foundation that holds.", "why": "Small lies seem to make life smoother: a sick day that isn't, a padded CV, flattering a boss. But every lie needs upkeep, and trust once lost is slow to rebuild. In a world of spin and fakes, people who can be trusted become rare and valuable.", "apply": [["Work", "Report bad news early; be honest on your CV."], ["Relationships", "Honesty, offered with care."], ["Money", "Honest accounts and honest taxes."], ["Yourself", "Admitting your own mistakes, first to yourself."]], "verses": [{"ref": "Muṇḍaka Upaniṣad 3.1.6", "deva": ["सत्यमेव जयते नानृतं सत्येन पन्था विततो देवयानः ।", "येनाक्रमन्त्यृषयो ह्याप्तकामा यत्र तत्सत्यस्य परमं निधानम् ॥"], "iast": ["satyam eva jayate nānṛtaṃ satyena panthā vitato devayānaḥ", "yenākramanty ṛṣayo hy āptakāmā yatra tat satyasya paramaṃ nidhānam"], "gloss": [["satyam eva", "truth alone"], ["jayate", "wins"], ["anṛtam", "untruth"], ["devayānaḥ", "the path of the gods"], ["āptakāmāḥ", "whose desires are fulfilled"], ["nidhānam", "treasure-house"]], "tr": "Truth alone wins, not untruth. By truth the divine path is laid out, by which the sages, their desires fulfilled, travel to where the supreme treasure of truth lies."}], "means": "The verse does not promise that truth wins every round quickly; it says truth is the path that leads somewhere real. The Gita (17.15) adds how to speak it: words that are true, pleasant and beneficial, and that do not cause needless distress. Truth used cruelly is not the goal. (Its opening words are also India's national motto.)", "question": "Would I be comfortable if everyone involved knew the whole truth of what I'm doing?", "story": {"title": "Satyakama Jabala", "src": "Chāndogya Upaniṣad 4.4", "text": ["Young Satyakama wanted to study with the teacher Haridrumata Gautama. Knowing he would be asked his lineage, he asked his mother, Jabala. She told him that she had served in many households in her youth and did not know who his father was.", "Satyakama went to Gautama and repeated her words exactly. Gautama replied that only a true brahmin would speak so honestly, accepted him as a student, and sent him to tend the herd, the beginning of his education.", "His truthfulness opened a door that a lie could only have opened falsely."]}, "mis": [["“Truth means saying everything bluntly.”", "The Gita asks for truth that is also kind and beneficial."], ["“Truth wins, so I will win.”", "It is truth that wins, not necessarily my side of the argument."]], "tryit": "For one week, tell no “small” lies, including false excuses. When tempted, say less rather than say something untrue.", "conn": [18, 8, 21]}, "18": {"sa": "Ahiṃsā", "deva": "अहिंसा", "en": "Non-Harm, Rightly Understood", "idea": "Cause no needless harm, in deed, in word or in thought.", "why": "Much harm today is quiet: cutting words online, gossip, contempt in a meeting, cruelty to animals for convenience. Because it is easy and often anonymous, it spreads.", "apply": [["Online", "Not posting what you would not say to someone's face."], ["Work", "Disagreeing without humiliating."], ["Food and animals", "Awareness of the suffering behind convenience."], ["Family", "Watching for harsh words spoken out of habit."]], "verses": [{"ref": "Bhagavad Gītā 16.2", "deva": ["अहिंसा सत्यमक्रोधस्त्यागः शान्तिरपैशुनम् ।", "दया भूतेष्वलोलुप्त्वं मार्दवं ह्रीरचापलम् ॥"], "iast": ["ahiṃsā satyam akrodhas tyāgaḥ śāntir apaiśunam", "dayā bhūteṣv aloluptvaṃ mārdavaṃ hrīr acāpalam"], "gloss": [["ahiṃsā", "non-harm"], ["akrodhaḥ", "freedom from anger"], ["apaiśunam", "not slandering"], ["dayā bhūteṣu", "compassion for all beings"], ["aloluptvam", "freedom from greed"], ["mārdavam", "gentleness"]], "tr": "Non-harm, truthfulness, freedom from anger, renunciation, calm, not slandering, compassion for all beings, freedom from greed, gentleness, modesty and steadiness: (these belong to the divine nature)."}], "means": "The Gita lists ahiṃsā among the divine qualities, and the same Gita asks Arjuna to fight. These do not contradict each other. Ahiṃsā is freedom from malice and from needless harm; it is not abandoning the duty to protect. A surgeon cuts; a judge sentences; a soldier defends the innocent. What ahiṃsā rules out is harm driven by anger, greed, pleasure or ego. The same list names freedom from anger and from slander, so harm through words counts too.", "question": "Is any harm here truly necessary, and if it is, am I acting without malice?", "story": {"title": "Valmiki and the krauncha birds", "src": "Rāmāyaṇa, Bāla Kāṇḍa", "text": ["The sage Valmiki was walking by the river Tamasa when he saw a pair of krauncha birds together. A hunter's arrow struck the male, and the female cried out over him.", "Valmiki, overwhelmed with grief, cursed the hunter, and his words came out in perfectly measured verse: the first śloka. His sorrow (śoka) became śloka.", "From that compassion for a single bird came the Ramayana itself. Sensitivity to suffering, even of the smallest being, is where great things begin."]}, "mis": [["“Ahiṃsā means never resisting or defending.”", "The Gita, which praises ahiṃsā, also calls for righteous action against injustice."], ["“If I don't hit anyone, I'm non-violent.”", "Words and intentions count too."]], "tryit": "Each day this week, catch one harsh thing before you say it, and replace it with something true and kind.", "conn": [20, 22, 17]}, "20": {"sa": "Dayā & Dāna", "deva": "दया दान", "en": "Compassion and Giving", "idea": "Let compassion move you to give, wisely and without expecting anything back.", "why": "Giving often becomes a transaction (a gift to win favour) or a performance (charity for the camera). Or we give carelessly, without asking whether it helps. The Gita offers a clear test.", "apply": [["Charity", "Find out where your money actually goes."], ["Time", "Mentoring someone junior who can do nothing for you."], ["Work", "Giving credit generously to others."], ["Family", "Care for elderly parents and relatives."]], "verses": [{"ref": "Bhagavad Gītā 17.20", "deva": ["दातव्यमिति यद्दानं दीयतेऽनुपकारिणे ।", "देशे काले च पात्रे च तद्दानं सात्त्विकं स्मृतम् ॥"], "iast": ["dātavyam iti yad dānaṃ dīyate 'nupakāriṇe", "deśe kāle ca pātre ca tad dānaṃ sāttvikaṃ smṛtam"], "gloss": [["dātavyam iti", "“this ought to be given”"], ["anupakāriṇe", "to one who will not return the favour"], ["deśe", "at the right place"], ["kāle", "at the right time"], ["pātre", "to a worthy recipient"]], "tr": "A gift given because it ought to be given, to someone who cannot return the favour, at the right place, at the right time and to a worthy recipient: that gift is called sāttvic."}], "means": "The Gita describes three kinds of giving (17.20–22). Sāttvic giving is described above. Rājasic giving is done grudgingly, or in hope of a return. Tāmasic giving is at the wrong place or time, to the wrong person, or with contempt. Dayā, compassion, is the motive; dāna, giving, is the act; discernment makes it effective.", "question": "Am I giving because it ought to be given, or because of what I'll get back?", "story": {"title": "King Shibi and the dove", "src": "Mahābhārata, Vana Parva", "text": ["A dove, chased by a hawk, flew into King Shibi's lap for shelter. The hawk demanded its prey: it was hungry, and the dove was its natural food.", "Shibi offered any other food, but the hawk wanted flesh equal to the dove's weight. Shibi cut flesh from his own body and placed it on a scale against the dove, but the dove kept outweighing it. At last Shibi climbed onto the scale himself.", "The hawk and the dove then revealed themselves as Indra and Agni, who had come to test him, and Shibi was made whole. His compassion protected the weak without denying the hawk's hunger. He paid the price himself."]}, "mis": [["“Give to anyone who asks.”", "The Gita asks for discernment of place, time and recipient."], ["“Giving means money.”", "Time, attention, skill and credit are gifts too."]], "tryit": "This week, give something to someone who cannot return it, and tell no one.", "conn": [25, 18, 21]}, "21": {"sa": "Atithi Devo Bhava", "deva": "अतिथिदेवो भव", "en": "The Guest as Divine", "idea": "Treat the person who comes to you as though the divine has come.", "why": "Busy lives and closed doors make us treat people as interruptions. A new colleague, a delivery worker, a visiting relative: each is a chance to practise reverence.", "apply": [["Home", "Welcoming visitors, planned or not."], ["Work", "Making newcomers feel at home."], ["Business", "Seeing customers as people, not transactions."], ["Travel", "Kindness to strangers and to those who serve you."]], "verses": [{"ref": "Taittirīya Upaniṣad 1.11.2", "deva": ["मातृदेवो भव । पितृदेवो भव ।", "आचार्यदेवो भव । अतिथिदेवो भव ॥"], "iast": ["mātṛdevo bhava, pitṛdevo bhava", "ācāryadevo bhava, atithidevo bhava"], "gloss": [["deva", "divine, worthy of reverence"], ["ācārya", "teacher"], ["atithi", "guest; traditionally explained as one who comes without a fixed date"], ["bhava", "be"]], "tr": "Let your mother be as a god to you. Let your father be as a god to you. Let your teacher be as a god to you. Let your guest be as a god to you."}, {"ref": "Taittirīya Upaniṣad 3.10.1", "deva": ["न कंचन वसतौ प्रत्याचक्षीत । तद्व्रतम् ॥"], "iast": ["na kaṃcana vasatau pratyācakṣīta, tad vratam"], "gloss": [["vasatau", "for shelter"], ["pratyācakṣīta", "should turn away"], ["vratam", "vow"]], "tr": "Do not turn away anyone who seeks shelter. That is the vow."}], "means": "This is part of the teacher's parting advice to students as they leave for life in the world. The guest stands beside mother, father and teacher. Seeing the divine in the guest is not sentimentality; it trains you to give your best attention to whoever is in front of you. Note that the Upanishad names four: mother, father, teacher and guest. Some popular versions add more names to the list, but those are not in the original.", "question": "How would I treat this person if I knew the Lord had sent them?", "story": {"title": "Shabari welcomes Rama", "src": "Rāmāyaṇa, Araṇya Kāṇḍa, sarga 74", "text": ["Shabari, a woman of a forest tribe, had served the sages of Matanga's hermitage. Before they departed, they told her that Rama would one day come.", "She waited for years, keeping the hermitage ready. When Rama and Lakshmana finally arrived, she welcomed them with deep reverence and offered the forest fruits she had gathered. Rama honoured her devotion.", "The popular detail that she tasted each berry first to check its sweetness comes from later devotional retellings, not from Valmiki's text."]}, "mis": [["“Hospitality means letting yourself be exploited.”", "It is practised with dharma and good sense."], ["“It's only for invited guests.”", "Atithi is, by tradition, the one who comes unannounced."]], "tryit": "This week, give one unexpected visitor or newcomer your full attention, and offer them something to eat or drink.", "conn": [20, 25, 24]}, "22": {"sa": "Kṣamā", "deva": "क्षमा", "en": "Forgiveness", "idea": "Letting go of resentment frees you more than it frees them.", "why": "Grudges cost sleep, health and relationships. Holding on to anger is like carrying a hot coal meant for someone else; it burns your own hand first.", "apply": [["Family", "Healing old rifts."], ["Work", "Letting go of slights that no longer matter."], ["Friendship", "Reconnecting after a misunderstanding."], ["Yourself", "Forgiving your own past mistakes, and learning from them."]], "verses": [{"ref": "Bhagavad Gītā 16.3", "deva": ["तेजः क्षमा धृतिः शौचमद्रोहो नातिमानिता ।", "भवन्ति सम्पदं दैवीमभिजातस्य भारत ॥"], "iast": ["tejaḥ kṣamā dhṛtiḥ śaucam adroho nātimānitā", "bhavanti sampadaṃ daivīm abhijātasya bhārata"], "gloss": [["tejaḥ", "vigour"], ["kṣamā", "forgiveness, forbearance"], ["dhṛtiḥ", "fortitude"], ["adrohaḥ", "freedom from ill-will"], ["na atimānitā", "absence of arrogance"], ["sampadaṃ daivīm", "the divine wealth"]], "tr": "Vigour, forgiveness, fortitude, purity, freedom from ill-will and absence of arrogance: these belong to one born with the divine nature, O Bhārata."}], "means": "Kṣamā sits right beside tejas, vigour, in this verse. In the Gita, forgiveness is not weakness; it is strength that chooses not to strike back in anger. Forgiveness and accountability can live together: you can let go of hatred and still require that a wrong be addressed.", "question": "Am I holding on to this to protect something, or simply because I can't let go?", "story": {"title": "Draupadi spares Ashwatthama", "src": "Bhāgavata Purāṇa, Canto 1, chapter 7", "text": ["After the war, Ashwatthama crept into the Pandava camp at night and killed Draupadi's five sleeping sons. Arjuna captured him and brought him, bound, before Draupadi.", "In the depth of her grief, she asked that he be released. He was the son of their teacher Drona, and she did not want his mother Kripi to weep as she herself was weeping.", "Krishna settled the matter: Ashwatthama's life was spared, but the jewel on his head was taken and he was sent away. Forgiveness did not erase consequence. (The Bhāgavata gives a condensed account; the Mahābhārata's Sauptika Parva tells the same episode at greater length.)"]}, "mis": [["“Forgive means forget, or allow it again.”", "You can forgive and still protect yourself."], ["“Forgiveness means no justice.”", "Even Ashwatthama faced consequences."]], "tryit": "Write a letter you will never send to someone you resent: what happened, how it hurt, and what you are choosing to release.", "conn": [18, 1, 2]}, "24": {"sa": "Vasudhaiva Kuṭumbakam", "deva": "वसुधैव कुटुम्बकम्", "en": "The World Is One Family", "idea": "To the large-hearted, the whole earth is one family.", "why": "Polarisation, online tribes and us-versus-them thinking are everywhere. The narrower our circle of care, the smaller our lives become.", "apply": [["Workplace", "Working well with people of every background."], ["Online", "Arguing with ideas without dehumanising people."], ["Neighbourhood", "Knowing and helping the people around you."], ["Nature", "Including other living beings and the earth in your circle of care."]], "verses": [{"ref": "Mahā Upaniṣad 6.71", "deva": ["अयं निजः परो वेति गणना लघुचेतसाम् ।", "उदारचरितानां तु वसुधैव कुटुम्बकम् ॥"], "iast": ["ayaṃ nijaḥ paro veti gaṇanā laghucetasām", "udāracaritānāṃ tu vasudhaiva kuṭumbakam"], "gloss": [["nijaḥ", "one's own"], ["paraḥ", "a stranger, other"], ["gaṇanā", "reckoning"], ["laghucetasām", "of the narrow-minded"], ["udāracaritānām", "of the large-hearted"], ["vasudhā", "the earth"], ["kuṭumbakam", "family"]], "tr": "“This one is mine, that one is a stranger”: such reckoning belongs to the narrow-minded. For those of noble conduct, the whole earth is one family."}], "means": "The verse contrasts narrowness of mind with largeness of heart. Seeing the world as family is not naïvety: families have boundaries, disagreements and duties too. The Gita's version is the “equal eye” (5.18): the wise look with an equal eye on the learned sage, the cow, the elephant, the dog and the outcaste. (The phrase also framed India's G20 presidency in 2023.)", "question": "Would I treat this person differently if they were family?", "story": {"title": "Prahlada teaches his classmates", "src": "Bhāgavata Purāṇa, Canto 7, chapters 6–7", "text": ["Prahlada, a five-year-old prince of the asuras, was sent to school with other asura boys. Whenever the teachers were away, he gathered his classmates and taught them what he had learned.", "The Lord dwells in all beings, he told them, so give up the asura habit of dividing the world into friends and enemies, and treat all beings as your own.", "His own father, Hiranyakashipu, was trying to kill him for his devotion, yet Prahlada wished him no harm. Narrow minds count who is “mine” and who is “other”. A child saw one family."]}, "mis": [["“It means trusting everyone blindly.”", "The same verse appears in the Hitopadeśa (1.71), spoken by a scheming jackal to win a deer's trust. Large-heartedness still needs Viveka (Dṛṣṭi 8)."], ["“It means having no boundaries.”", "Families have boundaries and duties too."]], "tryit": "This week, have one real conversation with someone from a very different background. Ask about their family.", "conn": [21, 20, 8]}, "25": {"sa": "Yajña & Sevā", "deva": "यज्ञ सेवा", "en": "Giving Back", "idea": "Life is a cycle of giving and receiving. Take part in it as a giver.", "why": "Modern life lets us take endlessly from nature, community and family without noticing the cycle that sustains us. When life becomes only taking, burnout and loneliness follow.", "apply": [["Environment", "Giving back to the earth that feeds you."], ["Community", "Regular volunteering, however small."], ["Work", "Building others up, not only yourself."], ["Family", "Serving at home without keeping score."]], "verses": [{"ref": "Bhagavad Gītā 3.11", "deva": ["देवान्भावयतानेन ते देवा भावयन्तु वः ।", "परस्परं भावयन्तः श्रेयः परमवाप्स्यथ ॥"], "iast": ["devān bhāvayatānena te devā bhāvayantu vaḥ", "parasparaṃ bhāvayantaḥ śreyaḥ param avāpsyatha"], "gloss": [["bhāvayata", "nourish"], ["anena", "by this (yajña)"], ["parasparam", "one another"], ["śreyaḥ param", "the highest good"], ["avāpsyatha", "you will attain"]], "tr": "Nourish the devas through this yajña, and let the devas nourish you. Nourishing one another, you will attain the highest good."}], "means": "In the Gita, yajña is far wider than a fire ritual: it is any action offered to the Lord for the good of all. The world runs on mutual support: rain, crops, the labour of countless others. Sevā, selfless service, is yajña in daily life. Gita 3.13 is blunt: the good who eat what remains after yajña are freed from wrong, but those who cook only for themselves eat sin.", "question": "What am I giving back to everything that sustains me?", "story": {"title": "The half-golden mongoose", "src": "Mahābhārata, Āśvamedhika Parva", "text": ["After the war, Yudhishthira performed a grand horse sacrifice with lavish gifts. As it ended, a mongoose appeared, half its body golden, and declared that this whole sacrifice did not equal a handful of barley flour once given by a poor brahmin family.", "During a famine, that family of four had gone without food for days and finally obtained a little flour. Just then a hungry guest arrived. One by one, each gave their share, until nothing was left for themselves.", "The mongoose had rolled in the scattered flour, and half its body turned to gold. Ever since, it had gone from sacrifice to sacrifice hoping to turn the other half, and never had."]}, "mis": [["“Yajña is only a ritual.”", "In the Gita it is any action offered for the good of all."], ["“Service means neglecting my own family.”", "Service begins close to home."]], "tryit": "Do one act of service this week for someone who will never know it was you.", "conn": [20, 9, 26]}, "26": {"sa": "Aparigraha", "deva": "अपरिग्रह", "en": "Take Only What Is Yours", "idea": "Take only what is yours, and hold even that lightly.", "why": "Consumer culture equates having with being. Hoarding money, things, credit, even attention, brings anxiety rather than security, and takes from others what they need.", "apply": [["Possessions", "Clearing out what you never use."], ["Money", "Wealth used, shared and held as a trust."], ["Work", "Not taking credit that belongs to others."], ["Nature", "Consuming within need."]], "verses": [{"ref": "Īśa Upaniṣad 1", "deva": ["ईशा वास्यमिदं सर्वं यत्किञ्च जगत्यां जगत् ।", "तेन त्यक्तेन भुञ्जीथा मा गृधः कस्यस्विद्धनम् ॥"], "iast": ["īśā vāsyam idaṃ sarvaṃ yat kiñca jagatyāṃ jagat", "tena tyaktena bhuñjīthā mā gṛdhaḥ kasya svid dhanam"], "gloss": [["īśā", "by the Lord"], ["vāsyam", "pervaded, governed"], ["tena tyaktena", "by renouncing (what is His)"], ["bhuñjīthāḥ", "enjoy"], ["mā gṛdhaḥ", "do not covet"], ["kasya svid dhanam", "anyone's wealth"]], "tr": "All this, whatever moves in this moving world, is pervaded and governed by the Lord. Enjoy by renouncing; do not covet anyone's wealth."}], "means": "The opening verse of the Īśa Upaniṣad sets the frame: everything belongs to the Lord. We are users, not owners. Hence the verse's paradox: enjoy by renouncing. Tyakta means “given up”; we enjoy rightly only when we give up the sense of ownership, receiving what comes as His and grasping at nothing that belongs to others. (Some teachers read tena tyaktena as “with what He has given”; both readings arrive at the same freedom from greed.) Aparigraha means not hoarding beyond need. The Gita (4.21) describes a person who has given up all possessiveness and acts only for the body's genuine needs.", "question": "Do I own this, or does it own me?", "story": {"title": "The Syamantaka jewel", "src": "Bhāgavata Purāṇa, Canto 10, chapters 56–57", "text": ["Satrajit received from the Sun god a brilliant jewel, Syamantaka, said to produce gold every day. Krishna suggested it be given to King Ugrasena for the good of all; Satrajit refused.", "His brother Prasena wore it while hunting and was killed by a lion, which was in turn killed by Jambavan, who took the jewel. People whispered that Krishna had stolen it. Krishna tracked the jewel, recovered it from Jambavan and returned it.", "Ashamed, Satrajit gave Krishna his daughter Satyabhama in marriage. But the jewel's story did not end there: later Satrajit himself was killed for it. A treasure clung to for oneself brought suspicion, conflict and death to nearly everyone who grasped it."]}, "mis": [["“Aparigraha means owning nothing.”", "It means not hoarding beyond need, and holding what you have as a trust."], ["“It's the same as minimalism.”", "Minimalism is about things; aparigraha is about the grasping mind."]], "tryit": "Give away five things you have not used in a year. Before any purchase this week, ask: need or want?", "conn": [7, 25, 27]}, "27": {"sa": "Puruṣārtha", "deva": "पुरुषार्थ", "en": "The Four Aims of Life", "idea": "Pursue wealth and enjoyment within dharma, with freedom (mokṣa) as the final aim.", "why": "There are two common failures: chasing money and pleasure without limits, and rejecting all ambition out of guilt. Many young adults swing between hustle culture and burnout.", "apply": [["Career and money", "Ambition that never crosses into adharma."], ["Relationships", "Love and enjoyment held within commitment."], ["Leisure", "Rest and fun as part of a good life, not an escape from it."], ["Inner life", "Keeping the highest aim in view, not postponing it to old age."]], "verses": [{"ref": "Bhagavad Gītā 7.11", "deva": ["बलं बलवतां चाहं कामरागविवर्जितम् ।", "धर्माविरुद्धो भूतेषु कामोऽस्मि भरतर्षभ ॥"], "iast": ["balaṃ balavatāṃ cāhaṃ kāmarāga-vivarjitam", "dharmāviruddho bhūteṣu kāmo 'smi bharatarṣabha"], "gloss": [["balam", "strength"], ["kāmarāga-vivarjitam", "free from craving and attachment"], ["dharma-aviruddhaḥ", "not opposed to dharma"], ["kāmaḥ", "desire"]], "tr": "Of the strong, I am the strength that is free from craving and attachment. In all beings, I am the desire that does not go against dharma, O best of the Bharatas."}], "means": "The four puruṣārthas are dharma (right living), artha (wealth and security), kāma (enjoyment and desire) and mokṣa (liberation). The tradition does not ask you to give up artha and kāma. It asks that they be bounded by dharma and pointed toward mokṣa. Gita 7.11 says it directly: desire that does not go against dharma is itself an expression of the Lord.", "question": "Is what I'm chasing in line with dharma, and does it move me toward what matters most?", "story": {"title": "Five answers to one question", "src": "Mahābhārata, Śānti Parva (section 167 in K. M. Ganguli's translation)", "text": ["After the war, Yudhishthira asked his brothers and Vidura which matters most: dharma, artha or kāma. Vidura put dharma first, since wealth rests on it. Arjuna argued for artha: without wealth, neither dharma nor enjoyment can be pursued.", "Nakula and Sahadeva proposed an order: first dharma, then wealth earned without abandoning dharma, then enjoyment. Bhima argued that desire drives all human effort, so all three deserve attention.", "Yudhishthira listened, then pointed beyond all three, to freedom from attachment to them: mokṣa. Each brother saw a real part of the truth. The wise hold all of them in their proper order."]}, "mis": [["“A spiritual life means rejecting money.”", "Artha earned by dharma is honoured."], ["“Mokṣa is for old age.”", "The highest aim shapes how you live now."]], "tryit": "Draw four columns: dharma, artha, kāma, mokṣa. Note roughly how your hours went this week. Which aim is starving, and which is overfed?", "conn": [12, 7, 10]}, "28": {"sa": "Guṇa", "deva": "गुण", "en": "The Three Qualities", "idea": "Your food, habits and company shape the quality of your mind.", "why": "We treat mood and focus as random. The Gita says they are shaped by what we take in: food, media and company. Change the inputs and the mind follows.", "apply": [["Food", "Fresh, nourishing food over stale or heavy food."], ["Media", "What you watch and read before sleep."], ["Company", "The people whose habits rub off on you."], ["Routine", "Sleep and waking at regular hours."]], "verses": [{"ref": "Bhagavad Gītā 14.5", "deva": ["सत्त्वं रजस्तम इति गुणाः प्रकृतिसम्भवाः ।", "निबध्नन्ति महाबाहो देहे देहिनमव्ययम् ॥"], "iast": ["sattvaṃ rajas tama iti guṇāḥ prakṛtisambhavāḥ", "nibadhnanti mahābāho dehe dehinam avyayam"], "gloss": [["sattva", "clarity, goodness"], ["rajas", "activity, passion"], ["tamas", "inertia, dullness"], ["prakṛti-sambhavāḥ", "born of nature"], ["nibadhnanti", "bind"], ["dehinam avyayam", "the eternal embodied self"]], "tr": "Sattva, rajas and tamas: these qualities, born of nature, bind the eternal self to the body, O mighty-armed one."}], "means": "Everyone has all three guṇas in shifting proportions. Sattva brings clarity and calm. Rajas brings drive, but also craving and restlessness. Tamas brings rest, but also dullness and confusion. The Gita applies this to food (17.8–10): sāttvic food promotes life, strength, health and cheerfulness; rājasic food is excessively bitter, sour, salty or hot and brings distress; tāmasic food is stale or spoiled. The same lens works for what you watch and who you spend time with. Even sattva binds, through attachment to happiness and knowledge (14.6); the aim is to rise through sattva toward devotion to the Lord.", "question": "Will what I'm about to take in bring clarity, agitation or dullness?", "story": {"title": "Vishvamitra becomes a brahmarshi", "src": "Rāmāyaṇa, Bāla Kāṇḍa", "text": ["Vishvamitra was a powerful king who visited the sage Vasishtha and coveted his wish-fulfilling cow. When Vasishtha would not give her, Vishvamitra tried to take her by force, and his army was defeated by the sage's spiritual power.", "Humbled, he turned to austerity, at first only to gain greater power. Again and again his tapas was broken by rajas and tamas: anger, ambition and desire. He spent years with the apsara Menaka; he cursed the apsara Rambha in anger and lost his merit once more.", "Only when he finally mastered anger and desire did Brahma recognise him as a brahmarshi, and Vasishtha himself greeted him as one. His transformation was the slow climb from rajas to sattva."]}, "mis": [["“The guṇas are fixed personality types.”", "Their balance shifts with your choices."], ["“Sattva is the final goal.”", "Even sattva binds through attachment; the aim lies beyond it."]], "tryit": "Each evening this week, rate your mind: clear, restless or dull. Note what you ate, watched and with whom you spent time. Look for the pattern.", "conn": [5, 14, 8]}, "3": {"sa": "Ratha", "deva": "रथ", "en": "The Chariot: Who Is Driving?", "idea": "Your life is a chariot. Make sure a wise intellect holds the reins, not the horses of the senses.", "why": "Many days are driven by whatever pulls hardest: a notification, a craving, a mood. We feel busy but not in charge. The chariot gives a simple map of who should lead whom.", "apply": [["Work", "Decide the day's priorities before the inbox decides them for you."], ["Money", "Let judgment set the budget; don't hand the wallet to the urge."], ["Relationships", "Respond from judgment, not from your first reaction."], ["Health", "Plan meals and sleep in advance, while the driver is alert."]], "verses": [{"ref": "Kaṭha Upaniṣad 1.3.3–4", "deva": ["आत्मानं रथिनं विद्धि शरीरं रथमेव तु ।", "बुद्धिं तु सारथिं विद्धि मनः प्रग्रहमेव च ॥", "इन्द्रियाणि हयानाहुर्विषयांस्तेषु गोचरान् ।", "आत्मेन्द्रियमनोयुक्तं भोक्तेत्याहुर्मनीषिणः ॥"], "iast": ["ātmānaṃ rathinaṃ viddhi śarīraṃ ratham eva tu", "buddhiṃ tu sārathiṃ viddhi manaḥ pragraham eva ca", "indriyāṇi hayān āhur viṣayāṃs teṣu gocarān", "ātmendriya-mano-yuktaṃ bhoktety āhur manīṣiṇaḥ"], "gloss": [["rathinam", "the rider, lord of the chariot"], ["śarīram", "the body"], ["buddhi", "intellect"], ["sārathi", "charioteer"], ["pragraha", "reins"], ["hayāḥ", "horses"], ["gocarān", "the roads they range over"]], "tr": "Know the self as the rider in the chariot, and the body as the chariot. Know the intellect as the charioteer, and the mind as the reins. The senses, they say, are the horses, and the objects of the senses are the roads they run on. The self, joined with body, senses and mind, the wise call the experiencer."}], "means": "The picture sets out an order. You, the self, are the rider. The intellect drives. The mind is the reins that link the driver to the horses. The senses pull. When the intellect is clear and the reins are firm, the horses carry you where you mean to go; when the reins go slack, the horses choose the road. The following verses (1.3.5–9) say so plainly: the one with understanding and a steady mind reaches the end of the journey, the supreme abode of Vishnu. Self-Mastery (Dṛṣṭi 14) is about drawing the senses in; Ratha is about who leads.", "question": "Who is holding the reins right now: my judgment, or my horses?", "story": {"title": "Arjuna chooses his charioteer", "src": "Mahābhārata, Udyoga Parva, chapter 7", "text": ["Before the war, Duryodhana and Arjuna both went to Dwaraka to ask Krishna for help. Krishna was asleep. Duryodhana sat by his head; Arjuna stood at his feet. When Krishna woke, he saw Arjuna first.", "Krishna offered a choice: on one side his vast Narayani army; on the other, himself alone, unarmed and not fighting. As the younger, Arjuna was given first choice. He chose Krishna, and Duryodhana went away delighted with the army.", "Krishna became Arjuna's charioteer, and it is from that driver's seat that he speaks the Gita. Arjuna understood that who guides the chariot matters more than how many horses run beside it."]}, "mis": [["“The senses are the enemy.”", "The horses are needed to move. They need direction, not destruction."], ["“A good intellect means a clever one.”", "A charioteer must know the road; the intellect needs the guidance of scripture and the Lord."]], "tryit": "Each morning, write the day's three “roads”: where you intend to go. At night, check whether the driver or the horses chose the route.", "conn": [14, 8, 2]}, "4": {"sa": "Śānti", "deva": "शान्ति", "en": "Calm the Waves", "idea": "Let thoughts and desires flow in like rivers into the ocean, without letting them toss you about.", "why": "Thoughts and wants arrive all day: worries, comparisons, cravings, plans. We usually treat each one as a command. That keeps the mind churning and tired.", "apply": [["Work", "An anxious thought before a meeting: notice it, don't obey it."], ["Social media", "Watch the urge to reply or post rise and fall."], ["Relationships", "An irritated thought need not become a sharp word."], ["Sleep", "Bedtime thoughts are rivers passing, not tasks to do now."]], "verses": [{"ref": "Bhagavad Gītā 2.70", "deva": ["आपूर्यमाणमचलप्रतिष्ठं समुद्रमापः प्रविशन्ति यद्वत् ।", "तद्वत्कामा यं प्रविशन्ति सर्वे स शान्तिमाप्नोति न कामकामी ॥"], "iast": ["āpūryamāṇam acala-pratiṣṭhaṃ samudram āpaḥ praviśanti yadvat", "tadvat kāmā yaṃ praviśanti sarve sa śāntim āpnoti na kāma-kāmī"], "gloss": [["āpūryamāṇam", "ever being filled"], ["acala-pratiṣṭham", "steady, unmoved within its bounds"], ["samudram", "the ocean"], ["kāmāḥ", "desires"], ["śāntim", "peace"], ["kāma-kāmī", "one who chases desires"]], "tr": "As the waters of rivers enter the ocean, which is ever being filled yet stays steady within its bounds, so the one into whom all desires enter in the same way attains peace; not the one who chases after desires."}], "means": "The ocean does not stop the rivers from flowing in. It simply does not overflow or shrink because of them. The Gita does not promise that thoughts and desires will stop arriving; it says peace belongs to the one who receives them without being driven by them. The contrast is the kāma-kāmī, who chases every wave. Samatvam (Dṛṣṭi 1) is about outcomes outside you; Śānti is about the stream of thoughts and desires within.", "question": "Is this thought a wave passing through, or a command I must obey?", "story": {"title": "The Avadhūta's teacher, the ocean", "src": "Bhāgavata Purāṇa, Canto 11, chapters 7–9 (the ocean: 11.8)", "text": ["King Yadu once met a wandering ascetic, an avadhūta, who owned nothing yet was full of joy. Asked his secret, the avadhūta said he had learned from twenty-four teachers found in the world around him.", "One of them was the ocean. In the rains, rivers pour into it; in summer they dry up. Yet the ocean neither swells beyond its shores nor shrinks. So, he said, the wise stay steady whether pleasant things pour in or dry up.", "Krishna tells this story to his friend Uddhava, to show that the world itself is full of teachers for one who watches."]}, "mis": [["“A calm mind is an empty mind.”", "The ocean is full. Calm is steadiness, not emptiness."], ["“Peace means forcing all desires out.”", "Peace comes from not being driven by them."]], "tryit": "Three times a day, pause for one minute. Name what is arriving (“worry”, “craving”, “planning”) and let it pass without acting on it.", "conn": [1, 6, 5]}, "6": {"sa": "Titikṣā", "deva": "तितिक्षा", "en": "Let Passing Discomfort Pass", "idea": "Heat and cold, pleasure and pain come and go. Bear them patiently.", "why": "Comfort has become an expectation. Small discomforts, a delayed train, a hard workout, a dull but necessary task, feel like emergencies. The less we can bear, the less we can do.", "apply": [["Fitness", "Staying with the hard part of the workout."], ["Work", "Finishing the tedious task that matters."], ["Relationships", "Bearing someone's bad day without retaliating."], ["Long goals", "Getting through the uncomfortable middle."]], "verses": [{"ref": "Bhagavad Gītā 2.14", "deva": ["मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः ।", "आगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत ॥"], "iast": ["mātrā-sparśās tu kaunteya śītoṣṇa-sukha-duḥkha-dāḥ", "āgamāpāyino 'nityās tāṃs titikṣasva bhārata"], "gloss": [["mātrā-sparśāḥ", "contacts of the senses with objects"], ["śīta-uṣṇa", "cold and heat"], ["sukha-duḥkha-dāḥ", "giving pleasure and pain"], ["āgama-apāyinaḥ", "coming and going"], ["anityāḥ", "not lasting"], ["titikṣasva", "bear them patiently"]], "tr": "The contacts of the senses with their objects, son of Kunti, bring cold and heat, pleasure and pain. They come and go; they do not last. Bear them patiently, Bhārata."}], "means": "Krishna's reasoning is simple: these experiences come and go. Knowing that a discomfort will pass makes it bearable. Titikṣā is not seeking pain or ignoring real harm; you still treat illness and leave danger. It is refusing to let a temporary discomfort decide your actions. Samatvam (Dṛṣṭi 1) is about outcomes and Śānti (Dṛṣṭi 4) about thoughts; Titikṣā is about the body and circumstances.", "question": "Will this matter in a week? Can I bear it until then?", "story": {"title": "Thirteen years of keeping their word", "src": "Mahābhārata, Vana Parva", "text": ["After losing the game of dice, the Pandavas were bound to spend twelve years in the forest and a thirteenth in hiding. The forest years brought heat and cold, hunger and hardship.", "Bhima and Draupadi urged Yudhishthira again and again to end the exile and fight at once. Yudhishthira refused: they had given their word, and he would bear the hardship until the term was complete.", "The Pandavas endured all thirteen years, and only then claimed their kingdom."]}, "mis": [["“Endure everything, even abuse.”", "Titikṣā is for passing discomforts, not for tolerating harm or injustice."], ["“Seek out suffering.”", "The Gita condemns harsh self-torture not sanctioned by scripture (17.5–6)."]], "tryit": "Choose one small, safe discomfort to bear each day this week: a cold-water wash, a walk in the heat, a task you dread. Notice that it passes.", "conn": [1, 4, 5]}, "11": {"sa": "Dharma", "deva": "धर्म", "en": "A Compass, Not a Convenience", "idea": "Decide what is right by a steady standard, not by what is convenient in the moment.", "why": "Everyday ethics often follows mood, the majority or advantage: “everyone does it”, “no one will know”, “it works for me”. Without a fixed reference we drift, and each convenient exception quietly becomes the next rule.", "apply": [["Work", "Rules bent “just this once”."], ["Money", "Taxes, bribes and shortcuts."], ["Relationships", "Keeping promises when breaking them is easier."], ["Online", "Not sharing what you haven't checked."]], "verses": [{"ref": "Bhagavad Gītā 16.24", "deva": ["तस्माच्छास्त्रं प्रमाणं ते कार्याकार्यव्यवस्थितौ ।", "ज्ञात्वा शास्त्रविधानोक्तं कर्म कर्तुमिहार्हसि ॥"], "iast": ["tasmāc chāstraṃ pramāṇaṃ te kāryākārya-vyavasthitau", "jñātvā śāstra-vidhānoktaṃ karma kartum ihārhasi"], "gloss": [["śāstram", "scripture"], ["pramāṇam", "standard, measure of truth"], ["kārya-akārya", "what to do and not do"], ["vyavasthitau", "in deciding"], ["arhasi", "you should"]], "tr": "Therefore let the scriptures be your standard in deciding what should and should not be done. Knowing what the scriptures lay down, you should act here accordingly."}], "means": "This verse closes chapter 16, just after the Gita describes the qualities that lift a person up and those that pull them down
